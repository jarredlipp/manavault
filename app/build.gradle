plugins { id 'com.android.application' }

android {
    namespace 'com.manavault.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.manavault.app'
        minSdk 26
        targetSdk 35
        versionCode 79
        versionName '5.11.5-offline-printing-engine'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'org.opencv:opencv:4.10.0'
}

// Prevent alternate/local build paths from shipping an APK with 0 artwork
// references. GitHub generates the seed catalog before running assembleDebug.
tasks.register('verifyArtworkReferences') {
    doLast {
        def file = file('src/main/assets/visual-index.json')
        if (!file.isFile()) throw new GradleException('Missing visual-index.json. Run the GitHub build workflow to generate the printing and fingerprint catalogs.')
        def payload = new groovy.json.JsonSlurper().parse(file)
        if (!(payload.cards instanceof List) || payload.cards.size() < 12) {
            throw new GradleException('Artwork index has fewer than 12 references; run the offline build workflow.')
        }
        def symbolFile=file('src/main/assets/symbol-index.json')
        if (!symbolFile.isFile()) throw new GradleException('Missing bundled expansion-symbol index')
        def symbols=new groovy.json.JsonSlurper().parse(symbolFile)
        if (symbols.format != 'manavault-symbol-v1' || !(symbols.sets instanceof List) || symbols.sets.size() < 12)
            throw new GradleException('Bundled set-symbol reference library is missing or incomplete')
        def catalog=file('src/main/assets/printing-catalog.sqlite.gz')
        if (!catalog.isFile() || catalog.length() < 2000000)
            throw new GradleException('Missing complete native printing database; run tools/build_native_catalog.py first')
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyArtworkReferences') }

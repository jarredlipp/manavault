plugins { id 'com.android.application' }

android {
    namespace 'com.manavault.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.manavault.app'
        minSdk 26
        targetSdk 35
        versionCode 85
        versionName '5.12.1-footer-identification'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'org.opencv:opencv:4.10.0'
}

// Guard against stale GitHub workflows which call only :app:assembleDebug.
// Generation is a build dependency, so missing assets are prepared BEFORE
// any Android packaging step instead of failing at the old artwork check.
tasks.register('prepareOfflineAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'tools/ensure_offline_assets.sh'
}

tasks.register('verifyArtworkReferences', Exec) {
    dependsOn tasks.named('prepareOfflineAssets')
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/verify_offline_assets.py'
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyArtworkReferences') }

// Assets are generated at build time; prevent the Android asset merger from
// snapshotting empty source placeholders before the generation task completes.
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn tasks.named('verifyArtworkReferences')
}

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ManaVault — MTG Collection Studio</title><style>
:root{color-scheme:dark;--bg:#0d111a;--panel:#171e2b;--panel2:#202a3b;--line:#334054;--txt:#f1f4fa;--muted:#a6b3c7;--accent:#a4e2ba;--gold:#f6d38c;--danger:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 0,#233248 0,transparent 38%),var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#2d3b50;border:1px solid #50617a;color:var(--txt);border-radius:10px;padding:10px 13px}button:hover{filter:brightness(1.15)}button.primary{background:var(--accent);color:#0e2419;border-color:var(--accent);font-weight:700}button.warn{color:var(--danger)}input,select,textarea{width:100%;background:#101722;border:1px solid #425169;color:var(--txt);border-radius:9px;padding:11px}textarea{min-height:110px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}h1,h2,h3,p{margin-top:0}h1{font-size:26px;letter-spacing:-.8px}h2{font-size:19px}h3{font-size:15px}.shell{max-width:1240px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-weight:850;font-size:23px;letter-spacing:-.7px}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:13px;margin-top:3px}.tabs{display:flex;gap:7px;overflow:auto;padding:20px 0 16px}.tabs button{white-space:nowrap}.tabs button.active{background:#a4e2ba;color:#0e2419;border-color:#a4e2ba}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:var(--panel2);border-radius:12px;padding:16px}.stat strong{font-size:25px;display:block}.stat small,.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #303c50;padding:12px 0}.row:last-child{border:0}.thumb{width:49px;height:68px;object-fit:cover;border-radius:5px;background:#263348}.tag{display:inline-block;border:1px solid #586780;border-radius:99px;color:#c9d7e8;font-size:11px;padding:3px 8px;margin:2px}.result{display:flex;align-items:center;gap:11px;border-bottom:1px solid #354154;padding:10px 0}.result:last-child{border:0}.result img{width:48px;height:66px;object-fit:cover;border-radius:5px}.small{font-size:12px}.pill{color:var(--accent)}.hidden{display:none!important}.empty{padding:30px 8px;text-align:center;color:var(--muted)}.notice{background:#233a35;border:1px solid #3d6959;border-radius:10px;padding:12px;color:#d6f4e1;font-size:13px}.error{color:var(--danger)}.stack{display:grid;gap:12px}.scroll{max-height:480px;overflow:auto}.footer{font-size:12px;color:var(--muted);margin:24px 0}canvas{max-width:100%;border-radius:10px}a{color:var(--accent)}@media(max-width:700px){.shell{padding:13px}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.panel{padding:14px}.top{align-items:flex-start}.row{align-items:flex-start}}
 .help-steps{padding-left:22px;line-height:1.75;color:var(--txt)}.help-steps li{margin-bottom:6px}.help-section{scroll-margin-top:15px}.help-section summary{font-weight:700;cursor:pointer;padding:10px 0;font-size:16px}.help-section details{border-top:1px solid var(--line);padding:6px 0}.help-section details p{line-height:1.6;color:var(--muted)}.help-section details[open] summary{color:var(--accent)}.help-note{border-left:3px solid var(--gold);padding:9px 13px;background:#292a31;color:#f3e5c5;border-radius:6px}.help-links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}.help-links button{font-size:13px} </style></head><body><div class="shell"><header class="top"><div><div class="brand">✦ Mana<span>Vault</span></div><div class="subtitle">Your cards. Your decks. Your next discovery.</div></div><div class="flex"><button id="exportBtn">Export backup</button><label for="importFile" style="margin:0"><span style="display:inline-block;border:1px solid #50617a;border-radius:10px;padding:10px 13px;cursor:pointer">Import backup</span></label><input id="importFile" type="file" accept="application/json" hidden></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main><div class="footer">ManaVault v5.11.5 · Native CameraX + legacy OCR · Collection saved locally on this device. Card details and prices from Scryfall when online. Not affiliated with Wizards of the Coast.</div></div><script src="card-db.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='manavault-v1';let state={cards:[],decks:[],wishlist:[],trades:[],alerts:[]};try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&Array.isArray(s.cards))state={...state,...s}}catch{};let tab='Dashboard',searchResults=[],scanCandidates=[],lastSearch='',busy=false;const tabs=['Dashboard','Collection','Scan cards','Deck builder','Wishlist & trades','Price alerts','Settings','Help guide'];const save=()=>{localStorage.setItem(STORE,JSON.stringify(state));render()};const money=n=>'$'+Number(n||0).toFixed(2);const qtyTotal=()=>state.cards.reduce((a,c)=>a+c.qty,0);const valueTotal=()=>state.cards.reduce((a,c)=>a+c.qty*(+c.price||0),0);const image=c=>c.image||c.image_small||c.image_url||c.image_uris?.small||'';
const mv594Placeholder='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 100"><rect width="72" height="100" rx="5" fill="#263348"/><rect x="8" y="8" width="56" height="84" rx="4" fill="none" stroke="#90a0b8" stroke-width="2"/><text x="36" y="58" text-anchor="middle" fill="#9aacc0" font-size="10">No art</text></svg>');window.mv594Placeholder=mv594Placeholder;const cardPrice=c=>c.prices?.usd||c.prices?.usd_foil||c.prices?.usd_etched||'0';const norm=s=>String(s||'').trim().toLowerCase();let info=c=>({id:c.id,name:c.name,set:c.set,set_name:c.set_name,collector_number:c.collector_number,rarity:c.rarity,colors:c.colors||[],color_identity:c.color_identity||[],type_line:c.type_line||'',oracle_text:c.oracle_text||'',cmc:c.cmc||0,legalities:c.legalities||{},image:c.image_uris?.small||c.card_faces?.[0]?.image_uris?.small||c.image_small||c.image_url||'',price:+cardPrice(c),updated:new Date().toISOString()});
function addCard(c,qty=1){let v=state.cards.find(x=>x.id===c.id);if(v)v.qty+=qty;else state.cards.push({...info(c),qty,condition:'NM',foil:false});save()}
function nav(){ $('#tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function render(){nav();let html='';if(tab==='Dashboard')html=dashboard();if(tab==='Collection')html=collection();if(tab==='Scan cards')html=scanner();if(tab==='Deck builder')html=decks();if(tab==='Wishlist & trades')html=wishes();if(tab==='Price alerts')html=alerts();if(tab==='Settings')html=settings();if(tab==='Help guide')html=helpGuide();$('#main').innerHTML=html;bind()}
const stat=(v,l)=>`<div class="stat"><strong>${v}</strong><small>${l}</small></div>`;
function dashboard(){const unique=new Set(state.cards.map(c=>c.name)).size;return `<h1>Collection overview</h1><div class="stats">${stat(qtyTotal(),'Physical cards')}${stat(unique,'Unique card names')}${stat(money(valueTotal()),'Estimated collection value')}${stat(state.decks.length,'Saved decks')}</div><div class="grid2" style="margin-top:15px"><section class="panel"><h2>Quick actions</h2><div class="stack"><button class="primary" data-go="Scan cards">Scan or search for cards →</button><button data-go="Deck builder">Find Commander builds →</button><button data-go="Collection">Browse your collection →</button></div></section><section class="panel"><h2>Most valuable cards</h2>${state.cards.length?state.cards.slice().sort((a,b)=>b.price-a.price).slice(0,5).map(c=>`<div class="row"><span>${esc(c.name)} <span class="muted small">×${c.qty}</span></span><b>${mv53Money(c.price)}</b></div>`).join(''):'<div class="empty">Add cards to see your collection insights.</div>'}</section></div><div class="notice">Start with Search in Scan cards, or paste a list of card names for batch import. Photos can be processed using optional browser OCR when available.</div>`}
function collection(){let q=window.filterQuery||'';let arr=state.cards.filter(c=>(c.name+' '+c.set_name).toLowerCase().includes(q.toLowerCase()));return `<h1>My collection</h1><div class="panel"><div class="flex"><input id="filter" class="grow" placeholder="Filter by card name or set" value="${esc(q)}"><button id="sortValue">Sort by value</button></div><div id="cardList" class="scroll">${cardRows(arr)}</div></div>`}
function cardRows(arr){return arr.length?arr.map(c=>`<div class="result"><img src="${esc(image(c)||mv594Placeholder)}" alt="Card artwork" loading="lazy" onerror="this.onerror=null;this.src=window.mv594Placeholder"><div class="grow"><b>${esc(c.name)}</b><div class="small muted">${c.unverifiedPrinting?'<strong>Printing unverified</strong>':esc(c.set_name||c.set||'')} · ${esc(c.condition||'NM')} · ${c.foil?'Foil':'Nonfoil'} · ${mv53Money(c.price)} each</div><div class="small muted">${esc(c.type_line)}</div>${c.unverifiedPrinting?`<button data-resolve-printing="${esc(c.id)}">Resolve edition</button>`:''}</div><div class="flex"><button data-dec="${esc(c.id)}">−</button><b>×${c.qty}</b><button data-inc="${esc(c.id)}">+</button><button data-trade="${esc(c.id)}" title="Mark for trade">⇄</button></div></div>`).join(''):'<div class="empty">No matching cards yet.</div>'}
function scanner(){return `<h1>Scan & import cards</h1><div class="grid2"><section class="panel"><h2>Search a card</h2><p class="muted small">Search Scryfall for exact printings and current reference prices.</p><div class="flex"><input id="searchInput" class="grow" placeholder="e.g. Sol Ring, Skullclamp" value="${esc(lastSearch)}"><button class="primary" id="searchBtn">Search</button></div><div id="searchResults" class="scroll">${resultRows()}</div></section><section class="panel"><h2>Camera / photo scan</h2><p class="muted small">Take a picture or upload a photo. Optional OCR extracts likely names; review matches before adding them.</p><input id="photo" type="file" accept="image/*" capture="environment" multiple><div id="scanStatus" class="muted small" style="margin:10px 0">Best results: one clearly readable card per photo. Multiple cards may need manual correction.</div><div id="scanResults" class="scroll">${scanCandidates.map(x=>`<div class="row">${esc(x)} <button data-lookup="${esc(x)}">Find card</button></div>`).join('')}</div></section></div><section class="panel"><h2>Batch import</h2><p class="muted small">Paste card names, one per line. Supports “4 Sol Ring”, “4x Sol Ring”, or “Sol Ring”. Batch uses the first Scryfall printing match; adjust printing afterward if needed.</p><textarea id="batch" placeholder="1 Sol Ring&#10;1 Arcane Signet&#10;2 Lightning Greaves"></textarea><div class="flex"><button class="primary" id="batchBtn">Import card names</button><span id="batchStatus" class="small muted"></span></div></section>`}
function resultRows(){return searchResults.length?searchResults.map((c,i)=>`<div class="result"><img src="${esc(info(c).image||mv594Placeholder)}" alt="Card artwork" loading="lazy"><div class="grow"><b>${esc(c.name)}</b><div class="small muted">${esc(c.set_name)} · ${esc(c.collector_number)} · ${money(cardPrice(c))}</div></div><button class="primary" data-add="${i}">+ Add</button></div>`).join(''):'<div class="empty">Search for a card to add it.</div>'}
async function scry(path){let r=await fetch('https://api.scryfall.com'+path);if(!r.ok)throw Error(r.status===404?'No matching card found':'Scryfall request failed ('+r.status+')');return r.json()}
async function search(q){lastSearch=q;$('#searchResults').innerHTML='<div class="empty">Searching…</div>';try{const r=await scry('/cards/search?q='+encodeURIComponent('!"'+q+'"')+'&unique=prints');searchResults=(r.data||[]).slice(0,30);$('#searchResults').innerHTML=resultRows();wireAdds()}catch(e){$('#searchResults').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function wireAdds(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCard(searchResults[+b.dataset.add]))}
function deckScore(c,colors){const ci=c.color_identity||[];if(!ci.every(x=>colors.includes(x)))return -1;let t=(c.type_line||'').toLowerCase(),o=(c.oracle_text||'').toLowerCase();return (t.includes('creature')?2:0)+(o.includes('draw')?2:0)+(o.includes('add {')?2:0)+(o.includes('destroy')?1:0)+(o.includes('token')?1:0)+(o.includes('search your library')?2:0)}
function deckCandidates(){return state.cards.filter(c=>/legendary creature|can be your commander/i.test((c.type_line||'')+' '+(c.oracle_text||'')) && c.legalities?.commander!=='not_legal').slice().sort((a,b)=>b.qty-a.qty)}
function decks(){return `<h1>Commander deck studio</h1><div class="grid2"><section class="panel"><h2>Discover commanders you own</h2><p class="muted small">Select a commander to build a collection-only starter list. Suggestions are heuristic, not AI-generated or a guaranteed complete 100-card deck.</p><div class="scroll">${deckCandidates().length?deckCandidates().map(c=>`<div class="row"><div><b>${esc(c.name)}</b><div class="small muted">Color identity: ${(c.color_identity||[]).join('')||'Colorless'}</div></div><button data-build="${esc(c.id)}">Build</button></div>`).join(''):'<div class="empty">Add legendary creatures to discover possible commanders.</div>'}</div></section><section class="panel"><h2>Saved deck concepts</h2>${state.decks.length?state.decks.map((d,i)=>`<div class="row"><div><b>${esc(d.name)}</b><div class="small muted">${d.cards.length} suggested cards · ${esc(d.created)}</div></div><div class="flex"><button data-viewdeck="${i}">View</button><button class="warn" data-deldeck="${i}">×</button></div></div>`).join(''):'<div class="empty">Your saved builds appear here.</div>'}<div id="deckDetail"></div></section></div>`}
function buildDeck(id){let cmd=state.cards.find(c=>c.id===id);if(!cmd)return;let cards=state.cards.filter(c=>c.id!==id&&c.legalities?.commander!=='not_legal').map(c=>({c,score:deckScore(c,cmd.color_identity||[])})).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score).slice(0,99).map(x=>({id:x.c.id,name:x.c.name,qty:Math.min(x.c.qty,/basic land/i.test(x.c.type_line)?99:1)}));state.decks.push({name:cmd.name+' — collection concept',commander:cmd.name,colors:cmd.color_identity||[],cards,created:new Date().toLocaleDateString()});save()}
function wishes(){return `<h1>Wishlist & trades</h1><div class="grid2"><section class="panel"><h2>Wishlist</h2><div class="flex"><input id="wishInput" placeholder="Card to acquire"><button class="primary" id="wishBtn">Add</button></div>${state.wishlist.map((w,i)=>`<div class="row">${esc(w)}<button data-delwish="${i}">Remove</button></div>`).join('')||'<div class="empty">No wishlist cards yet.</div>'}</section><section class="panel"><h2>Available for trade</h2>${state.trades.map((id,i)=>{let c=state.cards.find(x=>x.id===id);return c?`<div class="row">${esc(c.name)} <span>${money(c.price)} <button data-untrade="${i}">Remove</button></span></div>`:''}).join('')||'<div class="empty">Use ⇄ next to a collection card to mark it for trade.</div>'}</section></div>`}
function alerts(){return `<h1>Price watchlist</h1><div class="panel"><p class="muted small">Set a price threshold. Alerts are checked only when you open this page or manually refresh prices; this version does not send background notifications.</p><div class="grid3"><div><label>Card in collection</label><select id="alertCard">${state.cards.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Notify at or above (USD)</label><input id="alertThreshold" type="number" min="0" step="0.01" placeholder="10.00"></div><div style="align-self:end"><button class="primary" id="alertBtn">Add price watch</button></div></div>${state.alerts.map((a,i)=>{let c=state.cards.find(x=>x.id===a.id);return `<div class="row"><span>${esc(c?.name||'Removed card')} · target ${money(a.threshold)} · current ${money(c?.price)} ${c&&c.price>=a.threshold?'<span class="pill">● Threshold reached</span>':''}</span><button data-delalert="${i}">Remove</button></div>`}).join('')||'<div class="empty">No price watches yet.</div>'}<button id="refreshPrices">Refresh collection prices</button><span id="priceStatus" class="small muted"></span></div>`}
function settings(){return `<h1>Settings & data</h1><section class="panel"><h2>Your data</h2><p>All data is stored in this browser's localStorage. It is not synchronized between your phone and computer. Export a JSON backup to transfer devices.</p><div class="flex"><button id="export2">Download JSON backup</button><button class="warn" id="clearAll">Delete local collection</button></div></section><section class="panel"><h2>Prototype limitations</h2><p class="muted">Image OCR requires an internet connection to load Tesseract.js and can misread names. Card prices are Scryfall reference prices, not guaranteed sale prices. Foil and condition-based valuations, automatic missing-card optimization, cross-device accounts, AI chat, notifications, and native Android packaging are planned but not implemented.</p></section>`}
function backup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='manavault-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});if(tab==='Collection'){let f=$('#filter');f.oninput=()=>{window.filterQuery=f.value;$('#cardList').innerHTML=cardRows(state.cards.filter(c=>(c.name+' '+c.set_name).toLowerCase().includes(f.value.toLowerCase())));bindCollection()};$('#sortValue').onclick=()=>{$('#cardList').innerHTML=cardRows(state.cards.slice().sort((a,b)=>b.price-a.price));bindCollection()};bindCollection()}if(tab==='Scan cards'){ $('#searchBtn').onclick=()=>search($('#searchInput').value.trim());$('#searchInput').onkeydown=e=>{if(e.key==='Enter')search(e.target.value.trim())};wireAdds();$('#batchBtn').onclick=batchImport;$('#photo').onchange=scanPhotos;document.querySelectorAll('[data-lookup]').forEach(b=>b.onclick=()=>{lastSearch=b.dataset.lookup;render();search(lastSearch)})}if(tab==='Deck builder'){document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>buildDeck(b.dataset.build));document.querySelectorAll('[data-deldeck]').forEach(b=>b.onclick=()=>{state.decks.splice(+b.dataset.deldeck,1);save()});document.querySelectorAll('[data-viewdeck]').forEach(b=>b.onclick=()=>{let d=state.decks[+b.dataset.viewdeck];$('#deckDetail').innerHTML=`<h3>${esc(d.name)}</h3><p class="small muted">This is a candidate list, not a finalized legal deck. Check quantities and missing roles.</p><div class="scroll">${d.cards.map(c=>`<div class="row">${c.qty} × ${esc(c.name)}</div>`).join('')}</div><button id="copyDeck">Copy list</button>`;$('#copyDeck').onclick=()=>navigator.clipboard?.writeText(d.cards.map(c=>c.qty+' '+c.name).join('\n'))})}if(tab==='Wishlist & trades'){$('#wishBtn').onclick=()=>{let w=$('#wishInput').value.trim();if(w){state.wishlist.push(w);save()}};document.querySelectorAll('[data-delwish]').forEach(b=>b.onclick=()=>{state.wishlist.splice(+b.dataset.delwish,1);save()});document.querySelectorAll('[data-untrade]').forEach(b=>b.onclick=()=>{state.trades.splice(+b.dataset.untrade,1);save()})}if(tab==='Price alerts'){$('#alertBtn').onclick=()=>{let id=$('#alertCard').value,t=Number($('#alertThreshold').value);if(id&&t>0){state.alerts.push({id,threshold:t});save()}};document.querySelectorAll('[data-delalert]').forEach(b=>b.onclick=()=>{state.alerts.splice(+b.dataset.delalert,1);save()});$('#refreshPrices').onclick=refreshPrices}if(tab==='Settings'){$('#export2').onclick=backup;$('#clearAll').onclick=()=>{if(confirm('Delete all local cards, decks, and lists? Export a backup first.')){state={cards:[],decks:[],wishlist:[],trades:[],alerts:[]};save()}}}}
function bindCollection(){document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{let c=state.cards.find(c=>c.id===b.dataset.inc);c.qty++;save()});document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{let c=state.cards.find(c=>c.id===b.dataset.dec);if(--c.qty<=0)state.cards=state.cards.filter(x=>x!==c);save()});document.querySelectorAll('[data-trade]').forEach(b=>b.onclick=()=>{if(!state.trades.includes(b.dataset.trade))state.trades.push(b.dataset.trade);save()})}
async function batchImport(){if(busy)return;busy=true;let lines=$('#batch').value.split(/\n/).map(x=>x.trim()).filter(Boolean),ok=0,errors=[];for(let i=0;i<lines.length;i++){let m=lines[i].match(/^(\d+)\s*x?\s+(.+)$/i),qty=m?+m[1]:1,name=m?m[2]:lines[i];$('#batchStatus').textContent=`Importing ${i+1}/${lines.length}…`;try{let c=await scry('/cards/named?fuzzy='+encodeURIComponent(name));addCard(c,Math.min(qty,999));ok++}catch(e){errors.push(name)}await new Promise(r=>setTimeout(r,110))}busy=false;tab='Scan cards';render();$('#batchStatus').textContent=`Imported ${ok}/${lines.length}. ${errors.length?'Not found: '+errors.join(', '):''}`}
async function scanPhotos(e){let files=[...e.target.files];if(!files.length)return;let status=$('#scanStatus');status.textContent='Loading OCR engine…';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(Error('OCR engine could not load. Check internet connection.'));document.head.appendChild(s)})}scanCandidates=[];for(let i=0;i<files.length;i++){status.textContent=`Reading photo ${i+1}/${files.length}…`;let result=await Tesseract.recognize(files[i],'eng');let lines=result.data.text.split('\n').map(s=>s.trim()).filter(x=>x.length>=3&&x.length<70&&!/^\d+$/.test(x));if(lines.length)scanCandidates.push(lines[0]);}status.textContent='OCR suggestions below. Review each name using Find card before adding.';$('#scanResults').innerHTML=scanCandidates.map(x=>`<div class="row">${esc(x)} <button data-lookup="${esc(x)}">Find card</button></div>`).join('')||'No readable card names detected.';document.querySelectorAll('[data-lookup]').forEach(b=>b.onclick=()=>{lastSearch=b.dataset.lookup;render();search(lastSearch)})}catch(err){status.innerHTML='<span class="error">'+esc(err.message)+'</span>'}}
async function refreshPrices(){let out=$('#priceStatus'),ok=0;for(let c of state.cards){out.textContent=`Refreshing ${ok+1}/${state.cards.length}…`;try{let d=await scry('/cards/'+encodeURIComponent(c.id));c.price=+cardPrice(d);c.updated=new Date().toISOString();ok++}catch{}await new Promise(r=>setTimeout(r,110))}save();$('#priceStatus').textContent=`Updated ${ok} cards.`}

// Version 1.1: persistent deck library, editable deck lists, and inventory-aware coverage.
const oldDeckBind=bind;
function parseDeckText(text){let cards=[],section='main',errors=[];for(let raw of text.split(/\r?\n/)){let line=raw.trim();if(!line||/^#|^\/\//.test(line))continue;if(/^(commander|command zone|commanders)\s*:?$/i.test(line)){section='commander';continue}if(/^(deck|mainboard|main deck)\s*:?$/i.test(line)){section='main';continue}if(/^(sideboard|maybeboard|considering)\s*:?$/i.test(line)){section='side';continue}if(/^SB\s*:/i.test(line)){section='side';line=line.replace(/^SB\s*:\s*/i,'')}let m=line.match(/^(\d+)\s*x?\s+(.+)$/i);let qty=m?+m[1]:1;let name=(m?m[2]:line).replace(/\s+\([A-Z0-9]{2,8}\)\s+\S+\s*$/i,'').replace(/\s+\*F\*\s*$/i,'').trim();if(/^Commander:\s*/i.test(name)){section='commander';name=name.replace(/^Commander:\s*/i,'')}if(!name||qty<1||qty>999){errors.push(raw);continue}cards.push({name,qty,section})}let combined=[];for(let c of cards){let x=combined.find(y=>norm(y.name)===norm(c.name)&&y.section===c.section);if(x)x.qty+=c.qty;else combined.push(c)}return {cards:combined,errors}}
function deckQty(d){return (d.cards||[]).filter(c=>c.section!=='side').reduce((n,c)=>n+(Number(c.qty)||1),0)+(d.commander&&!d.cards.some(c=>c.section==='commander'&&norm(c.name)===norm(d.commander))?1:0)}
function ownedByName(name){return state.cards.filter(c=>norm(c.name)===norm(name)).reduce((n,c)=>n+c.qty,0)}
function deckNeeds(d){let used={};let all=[];for(let c of d.cards||[]){if(c.section==='side')continue;all.push({name:c.name,qty:+c.qty||1})}if(d.commander&&!all.some(c=>norm(c.name)===norm(d.commander)))all.push({name:d.commander,qty:1});let missing=[];for(let c of all){let key=norm(c.name);used[key]=(used[key]||0)+c.qty}for(let [key,qty] of Object.entries(used)){let own=ownedByName(key);if(own<qty)missing.push({name:all.find(c=>norm(c.name)===key).name,need:qty-own,have:own})}return missing}
function decks(){return `<h1>My decks</h1><div class="notice">Import existing decks by pasting a decklist. Importing a deck does <b>not</b> claim you physically own its cards; collection ownership is tracked separately.</div><div class="grid2" style="margin-top:15px"><section class="panel"><h2>Add an existing deck</h2><label>Deck name</label><input id="newDeckName" placeholder="e.g. Saheeli Artifacts"><label style="margin-top:10px">Commander (optional)</label><input id="newDeckCommander" placeholder="e.g. Saheeli, Radiant Creator"><label style="margin-top:10px">Paste cards — one per line</label><textarea id="newDeckText" style="min-height:210px" placeholder="Commander\n1 Saheeli, Radiant Creator\nDeck\n1 Sol Ring\n1 Arcane Signet\n12 Island\n12 Mountain"></textarea><p class="muted small">Supports 1 Card Name, 1x Card Name, Commander / Deck / Sideboard sections, and set hints like (M21) 123.</p><button class="primary" id="createDeck">Save deck</button><div id="deckMsg" class="small muted"></div></section><section class="panel"><h2>Saved decks (${state.decks.length})</h2>${state.decks.length?state.decks.map((d,i)=>`<div class="row"><div class="grow"><b>${esc(d.name)}</b><div class="small muted">${deckQty(d)} cards · ${esc(d.commander||'No commander set')} · ${deckNeeds(d).reduce((n,x)=>n+x.need,0)} not cataloged as owned</div></div><button data-viewdeck="${i}">Open</button><button data-deldeck="${i}" class="warn" title="Delete deck">×</button></div>`).join(''):'<div class="empty">No decks yet. Paste a decklist to get started.</div>'}<div class="row"><b>Build from cards you own</b></div><div class="scroll">${deckCandidates().slice(0,12).map(c=>`<div class="row"><span>${esc(c.name)}</span><button data-build="${esc(c.id)}">Suggest</button></div>`).join('')||'<p class="muted small">Catalog a legendary creature to see starter suggestions.</p>'}</div></section></div><section id="deckDetail" class="panel hidden"></section>`}
function openDeck(i){let d=state.decks[i];if(!d)return;let missing=deckNeeds(d);let list=(d.cards||[]).map(c=>`${c.qty||1} ${c.name}`).join('\n');let commanderListed=d.cards.some(c=>c.section==='commander'&&norm(c.name)===norm(d.commander));let total=deckQty(d);let html=`<div class="flex" style="justify-content:space-between"><h2>${esc(d.name)}</h2><button id="closeDeck">Close</button></div><div class="stats" style="margin-bottom:16px">${stat(total,'Deck cards')}${stat((d.cards||[]).length,'Distinct entries')}${stat(missing.reduce((n,x)=>n+x.need,0),'Not in collection')}${stat(total===100?'100':'—','Commander target')}</div><div class="grid2"><div><label>Deck name</label><input id="editDeckName" value="${esc(d.name)}"><label style="margin-top:10px">Commander</label><input id="editDeckCommander" value="${esc(d.commander||'')}"><label style="margin-top:10px">Edit card list</label><textarea id="editDeckText" style="min-height:280px">${esc((d.cards||[]).map(c=>(c.section==='commander'?'Commander\n':c.section==='side'?'SB: ':'')+(c.qty||1)+' '+c.name).join('\n'))}</textarea><div class="flex"><button class="primary" id="saveDeckEdit">Save changes</button><button id="copyDeckList">Copy decklist</button></div><p class="small muted">Deck count includes commander if it is named separately. Sideboard entries are excluded.</p></div><div><h3>Collection coverage</h3><p class="small muted">Checks cards cataloged in your collection; deck imports don't automatically add physical copies. Multiple decks may reference the same physical card.</p>${missing.length?`<div class="scroll">${missing.map(c=>`<div class="row"><span>${esc(c.name)}</span><span class="small error">Need ${c.need} · own ${c.have}</span></div>`).join('')}</div>`:'<div class="notice">Every card in this deck is cataloged in your collection.</div>'}<button id="copyMissing" style="margin-top:12px">Copy missing-card list</button><button id="addMissingWishlist" style="margin-top:12px">Add missing to wishlist</button></div></div>`;let target=$('#deckDetail');target.innerHTML=html;target.classList.remove('hidden');target.scrollIntoView({behavior:'smooth',block:'start'});$('#closeDeck').onclick=()=>target.classList.add('hidden');$('#saveDeckEdit').onclick=()=>{let parsed=parseDeckText($('#editDeckText').value);if(parsed.errors.length){alert('Some lines could not be parsed: '+parsed.errors.join(', '));return}let cmd=$('#editDeckCommander').value.trim();let entries=parsed.cards.map(c=>({...c,name:c.name.replace(/^Commander:\s*/i,'')}));for(let c of entries)if(/^Commander:\s*/i.test(c.name))c.section='commander';d.name=$('#editDeckName').value.trim()||d.name;d.commander=cmd;d.cards=entries;save();openDeck(i)};$('#copyDeckList').onclick=()=>navigator.clipboard?.writeText((d.commander?'Commander\n1 '+d.commander+'\nDeck\n':'')+list);$('#copyMissing').onclick=()=>navigator.clipboard?.writeText(missing.map(c=>c.need+' '+c.name).join('\n'));$('#addMissingWishlist').onclick=()=>{for(let c of missing)if(!state.wishlist.some(w=>norm(w)===norm(c.name)))state.wishlist.push(c.name);save();openDeck(i)}}
bind=function(){oldDeckBind();if(tab!=='Deck builder')return;$('#createDeck').onclick=()=>{let name=$('#newDeckName').value.trim(),cmd=$('#newDeckCommander').value.trim(),parsed=parseDeckText($('#newDeckText').value);if(!name){$('#deckMsg').textContent='Enter a deck name.';return}if(parsed.errors.length){$('#deckMsg').textContent='Could not read: '+parsed.errors.join(' | ');return}if(!parsed.cards.length&&!cmd){$('#deckMsg').textContent='Add at least one card or commander.';return}let commanderLine=parsed.cards.find(c=>c.section==='commander');if(!cmd&&commanderLine)cmd=commanderLine.name;state.decks.push({name,commander:cmd,cards:parsed.cards,created:new Date().toLocaleDateString()});save();openDeck(state.decks.length-1)};document.querySelectorAll('[data-viewdeck]').forEach(b=>b.onclick=()=>openDeck(+b.dataset.viewdeck));document.querySelectorAll('[data-deldeck]').forEach(b=>b.onclick=()=>{let i=+b.dataset.deldeck;if(confirm('Delete '+state.decks[i].name+'? This will not delete collection cards.')){state.decks.splice(i,1);save()}});document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{buildDeck(b.dataset.build);openDeck(state.decks.length-1)})};

function scanDestination(){return scanDeckIndex>=0&&state.decks[scanDeckIndex]?state.decks[scanDeckIndex]:null}
function deckPickerHTML(){return `<section class="panel"><h2>Where should scanned cards go?</h2><div class="grid2"><div><label>Destination</label><select id="scanDeckSelect"><option value="-1">Collection only (no deck)</option>${state.decks.map((d,i)=>`<option value="${i}" ${i===scanDeckIndex?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div><label style="display:flex;align-items:center;gap:8px;margin-top:25px"><input type="checkbox" id="scanOwn" ${scanAlsoOwn?'checked':''} style="width:auto"> Also add physical copies to my collection</label></div></div><p class="muted small">Choose an existing deck, then use card search, photo scanning, or batch import below. Every confirmed card goes to that deck. Turn off the checkbox if the cards are already cataloged; this prevents counting the same physical cards twice.</p><div id="scanDeckStatus" class="small muted">${scanDestination()?'Scanning into '+esc(scanDestination().name):'Scanning into collection'}</div></section>`}

function insertIntoDeck(card,qty=1){let d=scanDestination();if(!d)return false;qty=Math.max(1,Math.min(999,Math.floor(Number(qty)||1)));d.cards=Array.isArray(d.cards)?d.cards:[];let name=card.name;let existing=d.cards.find(x=>x.id===card.id&&x.section!=='side');if(existing)existing.qty=(Number(existing.qty)||1)+qty;else d.cards.push({id:card.id,name,qty,section:'main',set:card.set||'',collector_number:card.collector_number||''});return true}

async function batchScanIntoDeck(){if(busy)return;let lines=($('#batch')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return;busy=true;let ok=0,errors=[];let btn=$('#batchBtn'),status=$('#batchStatus');btn.disabled=true;for(let i=0;i<lines.length;i++){let m=lines[i].match(/^(\d+)\s*x?\s+(.+)$/i),qty=m?+m[1]:1,name=m?m[2]:lines[i];status.textContent=`Importing ${i+1}/${lines.length}…`;try{let card=await scry('/cards/named?fuzzy='+encodeURIComponent(name));insertIntoDeck(card,qty);if(scanAlsoOwn||!scanDestination()){let own=state.cards.find(c=>c.id===card.id);if(own)own.qty+=qty;else state.cards.push({...info(card),qty,condition:'NM',foil:false})}ok++}catch(e){errors.push(name)}await new Promise(r=>setTimeout(r,110))}busy=false;save();let result=`Imported ${ok}/${lines.length} into ${scanDestination()?.name||'collection'}. ${errors.length?'Not found: '+errors.join(', '):''}`;let target=$('#batchStatus');if(target)target.textContent=result;let st=$('#scanDeckStatus');if(st)st.textContent=result}

root.querySelectorAll('[data-visual-name]').forEach(el=>el.oninput=()=>{let x=visualItems[+el.dataset.visualName];x.name=el.value;x.match=null;x.status='Needs match';});root.querySelectorAll('[data-visual-qty]').forEach(el=>el.onchange=()=>visualItems[+el.dataset.visualQty].qty=Math.max(1,Math.min(99,+el.value||1)));root.querySelectorAll('[data-visual-use]').forEach(el=>el.onchange=()=>visualItems[+el.dataset.visualUse].use=el.checked);root.querySelectorAll('[data-visual-find]').forEach(el=>el.onclick=async()=>{let i=+el.dataset.visualFind,x=visualItems[i];x.status='Looking up…';try{x.match=await scry('/cards/named?fuzzy='+encodeURIComponent(x.name.trim()));x.status='Matched — verify title and printing';x.use=true}catch(e){x.match=null;x.status='No match; correct title and retry'}visualRows()});$('#visualCommit').onclick=()=>{let confirmed=visualItems.filter(x=>x.use&&x.match);if(!confirmed.length){$('#visualCommitStatus').textContent='No confirmed matches selected.';return}let destination=scanDestination()?.name||'collection';if(!confirm(`Add ${confirmed.reduce((a,x)=>a+x.qty,0)} card(s) to ${destination}? Check names and quantities first.`))return;for(let x of confirmed){insertIntoDeck(x.match,x.qty);if(scanAlsoOwn||!scanDestination()){let old=state.cards.find(c=>c.id===x.match.id);if(old)old.qty+=x.qty;else state.cards.push({...info(x.match),qty:x.qty,condition:'NM',foil:false})}x.use=false;x.status='Added'}save();let st=$('#scanDeckStatus');if(st)st.textContent=`Added ${confirmed.length} confirmed entries to ${destination}.`;visualRows()};}
async function visualScan(){let f=$('#visualPhoto')?.files?.[0],status=$('#visualStatus');if(!f){status.textContent='Choose a photo first.';return}let cols=Math.max(1,Math.min(5,+$('#visualCols').value||1)),rows=Math.max(1,Math.min(5,+$('#visualRows').value||1));if(cols*rows>20){status.textContent='Maximum 20 cards per photo. Reduce rows or columns.';return}$('#visualStart').disabled=true;try{let bitmap=await createImageBitmap(f);let w=bitmap.width,h=bitmap.height;let preview=document.createElement('canvas');preview.width=Math.min(900,w);preview.height=Math.round(preview.width*h/w);let ctx=preview.getContext('2d');ctx.drawImage(bitmap,0,0,preview.width,preview.height);ctx.strokeStyle='#a4e2ba';ctx.lineWidth=2;for(let c=1;c<cols;c++){let x=c*preview.width/cols;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,preview.height);ctx.stroke()}for(let r=1;r<rows;r++){let y=r*preview.height/rows;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(preview.width,y);ctx.stroke()}$('#visualPreview').replaceChildren(preview);status.textContent='Loading recognition engine…';if(!window.Tesseract)await new Promise((resolve,reject)=>{let t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';t.onload=resolve;t.onerror=()=>reject(Error('OCR unavailable. Check your connection.'));document.head.appendChild(t)});visualItems=[];let worker=await Tesseract.createWorker('eng');try{for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let i=r*cols+c;status.textContent=`Reading card ${i+1} of ${rows*cols}…`;let crop=document.createElement('canvas');crop.width=450;crop.height=630;let g=crop.getContext('2d');let cellW=w/cols,cellH=h/rows;g.drawImage(bitmap,c*cellW,r*cellH,cellW,cellH,0,0,450,630);let title=document.createElement('canvas');title.width=900;title.height=150;title.getContext('2d').drawImage(crop,10,8,430,95,0,0,900,150);let result=await worker.recognize(title);let name=(result.data.text||'').split(/\n/).map(t=>t.trim()).filter(t=>t.length>2&&t.length<70)[0]||'';let item={crop:crop.toDataURL('image/jpeg',.75),name,qty:1,use:false,match:null,status:name?'OCR title — matching':'No title found — type name'};visualItems.push(item);if(name){try{item.match=await scry('/cards/named?fuzzy='+encodeURIComponent(name));item.use=true;item.status='Matched — verify title and printing'}catch{item.status='No match — correct title'}}visualRows()}}finally{await worker.terminate()}status.textContent=`Processed ${visualItems.length} card positions. Review matches, edit mistakes, and select cards to add.`;bitmap.close()}catch(err){status.textContent='Scan failed: '+err.message+' Try a smaller, clearer photo or manual import.'}finally{$('#visualStart').disabled=false}}

// Version 1.5: scan audio feedback (generated locally, no audio files).
let scanAudioLevel=Number(localStorage.getItem('manavault_scan_volume') ?? '0.45');
let scanAudioContext;
function scanTone(ok){
  if(scanAudioLevel<=0)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    scanAudioContext ||= new AC();
    if(scanAudioContext.state==='suspended')scanAudioContext.resume().catch(()=>{});
    const start=scanAudioContext.currentTime+0.02;
    const notes=ok?[{f:660,t:0,d:.10},{f:880,t:.12,d:.16}]:[{f:330,t:0,d:.14},{f:220,t:.16,d:.22}];
    notes.forEach(n=>{
      const o=scanAudioContext.createOscillator(),g=scanAudioContext.createGain();
      o.type=ok?'sine':'triangle';o.frequency.value=n.f;
      g.gain.setValueAtTime(.0001,start+n.t);
      g.gain.exponentialRampToValueAtTime(Math.max(.0001,scanAudioLevel*.16),start+n.t+.015);
      g.gain.exponentialRampToValueAtTime(.0001,start+n.t+n.d);
      o.connect(g).connect(scanAudioContext.destination);
      o.start(start+n.t);o.stop(start+n.t+n.d+.02);
    });
  }catch(e){console.warn('Audio unavailable',e)}
}

};
bind=function(){

 if(tab==='Scan cards'){
  const vol=$('#scanVolume');
  if(vol)vol.oninput=()=>{scanAudioLevel=Number(vol.value)/100;localStorage.setItem('manavault_scan_volume',String(scanAudioLevel));$('#scanVolumeText').textContent=Math.round(scanAudioLevel*100)+'%'};
  $('#scanSoundSuccess').onclick=()=>scanTone(true);

 }

function helpGuide(){return `<h1>Help & user guide</h1><p class="muted">ManaVault v1.4 · Everything you need to get started. This guide works offline.</p>
<section class="panel"><h2>Quick start</h2><ol class="help-steps"><li>Open <b>Scan cards</b> and choose <b>Collection only</b> or an existing deck.</li><li>Search for a card, import a list, or upload a photo.</li><li>Confirm each card match and quantity before adding it.</li><li>Open <b>Collection</b> to review your inventory or <b>Deck builder</b> to manage decks.</li><li>Use <b>Export backup</b> regularly to keep a copy of your work.</li></ol><div class="help-links"><button class="primary" data-help-go="Scan cards">Start scanning →</button><button data-help-go="Deck builder">My decks →</button><button data-help-go="Settings">Backup options →</button></div><div class="help-note">Your cards and decks are stored in this browser on this device, not in a shared account. Sending the HTML file to a friend does not send your saved collection.</div></section>
<section class="panel help-section"><h2>Using ManaVault</h2>
<details open><summary>How do I add one card?</summary><p>Go to <b>Scan cards</b>, select the destination, type a card name in <b>Search a card</b>, press <b>Search</b>, and add the correct result. Check the set and artwork when choosing a printing. The search needs internet access to Scryfall.</p></details>
<details><summary>How do I scan multiple cards from one photo?</summary><p>Open <b>Scan cards → Visual multi-card scanner (beta)</b>. Lay out 2–20 cards face up, upright, with equal spacing. Take a straight overhead photo. Choose the number of rows and columns, then press <b>Detect card titles</b>. Review the cropped card images, correct names, adjust quantities, select <b>Include</b> for correct matches, and press <b>Add confirmed cards</b>. The grid divides the whole photo into equal cells; it does not automatically locate randomly placed cards.</p><p>For your first test, try 2×2 cards. Good lighting, sharp focus, and no glare improve recognition. A photo with too much empty border can shift the crop positions.</p></details>
<details><summary>How do I scan directly into an existing deck?</summary><p>Go to <b>Deck builder</b> and press <b>Scan cards →</b> beside the deck you want. Alternatively, open <b>Scan cards</b> and select the deck from <b>Destination</b>. Search, scan, or batch import; confirmed cards will be added to that deck's list.</p><p>Use <b>Also add physical copies to my collection</b> only if those physical cards are not already counted in your inventory. Otherwise, leave it unchecked to avoid duplicate ownership totals.</p></details>
<details><summary>How do I create a deck or import a decklist?</summary><p>Open <b>Deck builder</b>, enter a deck name and commander, and paste your decklist into the import field. Use one card per line, such as <code>1 Sol Ring</code> or <code>2 Arcane Signet</code>. Save the deck, then open its details to review and edit it. Importing a decklist does not automatically prove you own its cards.</p></details>
<details><summary>How do I manage quantities and duplicates?</summary><p>Open <b>Collection</b> and use the + and − controls to change the count for a specific printing. Cards with different Scryfall printing IDs can appear separately. Review foil, set, and condition details carefully when valuing your collection.</p></details>
<details><summary>What do deck suggestions and missing cards mean?</summary><p>The <b>Deck builder</b> can suggest builds and compare decklists against your cataloged inventory. Suggestions are basic heuristics, not yet a full AI-powered, Commander-legal optimization system. A missing card means it has not been found in your cataloged collection; it may still be a physical card you haven't scanned.</p></details>
<details><summary>How do prices, wishlist, trades, and alerts work?</summary><p>Card searches retrieve reference price information from Scryfall when available. These are estimates, not guaranteed sale prices, and can vary by set, condition, foil status, and market. Use <b>Wishlist & trades</b> to organize cards you want or may trade. <b>Price alerts</b> are checked manually in this prototype; they do not send automatic background notifications.</p></details>
<details><summary>How do I back up, restore, or share my data?</summary><p>Press <b>Export backup</b> in the header to save a JSON file containing your ManaVault data. Use <b>Import backup</b> to restore it in another browser or device. Keep the backup private if it contains your collection details. To share the app itself, send the HTML file; your friend starts with a separate collection.</p></details>
</section>
<section class="panel help-section"><h2>Scan sounds</h2><p>Open <b>Scan cards → Scan sounds</b> to adjust volume from 0% (muted) to 100%. A rising chime indicates at least one card was recognized; a falling chime indicates no matches or an unsuccessful scan. Use the test buttons to hear both sounds. Your volume setting is saved on this device. Some mobile browsers require a tap before audio plays.</p></section><section class="panel help-section"><h2>Troubleshooting</h2>
<details><summary>Camera or photo picker won't open</summary><p>Try opening ManaVault in Chrome or another modern browser and use the file-upload option to select a photo from your gallery. Direct camera access may be restricted when the app is opened as a local HTML file. A secure hosted version would support camera permissions more reliably.</p></details>
<details><summary>Cards are misidentified or OCR fails</summary><p>Check internet access; the OCR library loads from a CDN and card matching uses Scryfall. Use a sharper photo, fewer cards, a flatter layout, and matching row/column settings. Correct any title manually and press <b>Find match</b> before saving. Exact printing and foil identification are not guaranteed by OCR.</p></details>
<details><summary>My collection disappeared</summary><p>Confirm you're using the same browser and storage context as before. Private browsing, clearing site data, or opening a local file under a different origin can cause your stored collection to be unavailable. Restore from your last exported JSON backup.</p></details>
<details><summary>Card search or prices don't load</summary><p>Check your connection and try again later. The app relies on the public Scryfall API for card information. Local HTML file security restrictions or service availability may affect requests.</p></details>
<details><summary>Can I use ManaVault offline?</summary><p>Previously saved local decks and collection data can be viewed offline. Online card searches, reference prices, and first-time OCR library loading require internet access. There is no cloud sync or automatic multi-device backup yet.</p></details>
</section><section class="panel"><h2>About this version</h2><p class="muted">ManaVault is an experimental, locally saved prototype. Always confirm card matches and keep a backup before importing or making large changes. It is not affiliated with Wizards of the Coast or Scryfall.</p><button id="helpTop">Back to top ↑</button></section>`}

// v2.1 hybrid: local indexed names (one Scryfall catalog download), fuzzy OCR, selective artwork comparison.
function mvHybridNorm(x){return String(x||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function mvHybridEdit(a,b){let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}
let mvHybridBuckets=new Map(),mvHybridExact=new Map(),mvUnknownNameTried=new Set();
let mvSceneStartedAt=0,mvSuccessfulReadTimes=[];
function mvHybridIndex(names){mvNames=names;mvHybridBuckets.clear();mvHybridExact.clear();for(let name of names){let n=mvHybridNorm(name);if(!n)continue;for(const alias of [name,...String(name).split(' // ')]){let n=mvHybridNorm(alias);if(!n)continue;if(alias===name||!mvHybridExact.has(n))mvHybridExact.set(n,name);let key=n.slice(0,2);if(!mvHybridBuckets.has(key))mvHybridBuckets.set(key,[]);mvHybridBuckets.get(key).push({name,n})}}mvNamesReady=true;
 try{if(typeof window!=='undefined'&&window.ManaVaultNativeScanner?.updateNameIndex)ManaVaultNativeScanner.updateNameIndex(JSON.stringify(names))}catch(e){console.warn('Native name index deferred',e)}
 mvLogCamera('Hybrid name index loaded: '+names.length+' cards')}
async function mvHybridLoadNames(){if(mvNamesReady)return;try{let saved=localStorage.getItem('mv_hybrid_names_v1');if(saved){let parsed=JSON.parse(saved);if(Array.isArray(parsed)&&parsed.length>1000){mvHybridIndex(parsed);if(Date.now()-Number(localStorage.getItem('mv_names_updated')||0)<7*86400000)return}}}catch{}try{let res=await fetch('https://api.scryfall.com/catalog/card-names');if(!res.ok)throw Error('HTTP '+res.status);let obj=await res.json();if(Array.isArray(obj.data)){mvHybridIndex(obj.data);try{localStorage.setItem('mv_hybrid_names_v1',JSON.stringify(obj.data));localStorage.setItem('mv_names_updated',String(Date.now()))}catch{}}}catch(e){mvLogCamera('Name catalog unavailable; online fuzzy fallback: '+e.message,'info')}}
// v4.7: OCR evidence is not the same as confidence in a catalog candidate.
// Reject one-character and generic-text candidates, and compare title-shaped
// substrings so an extra mana symbol does not defeat a valid reading.
function mvHybridCandidates(raw){
 const n=mvHybridNorm(raw).replace(/(?:\s+(?:[0-9]+[a-z]?|[wubrgc]))+$/g,'').trim();
 if(!n)return[];if(!mvNamesReady)return[];
 // Always honor real catalog names, including short or unusual titles.
 if(mvHybridExact.has(n))return [{name:mvHybridExact.get(n),score:1,exact:true}];
 // Reject noise only after the exact-name lookup.
 if(n.length<3||/(.)\1{4,}/i.test(n.replace(/ /g,''))||/^(?:[a-z]{1,2}\s+){4,}[a-z]{1,2}$/.test(n))return[];
 if(mvHybridExact.has(n))return [{name:mvHybridExact.get(n),score:1,exact:true}];
 const words=n.split(' ').filter(w=>w.length>=3), ranked=[],seen=new Set();
 // OCR may include a trailing mana cost. Test complete leading phrases before fuzzy search.
 const parts=n.split(' ');for(let end=parts.length;end>=1;end--){const prefix=parts.slice(0,end).join(' ');const found=mvHybridExact.get(prefix);if(found&&prefix.length>=6&&end>=2&&parts.length-end<=2)return [{name:found,score:1,exact:true}];}
 const pools=[];
 for(const word of words){pools.push(...(mvHybridBuckets.get(word.slice(0,2))||[]));}
 // Missing first letters are common when the left edge of a title is clipped.
 // Limit suffix recovery to long words and demand nearly complete remaining text.
 for(const word of words){if(word.length>=5){
   for(const [key,items] of mvHybridBuckets){if(key[1]===word[0])pools.push(...items)}
 }}
 for(const item of pools){if(seen.has(item.name))continue;seen.add(item.name);
   const a=item.n;if(a.length<4)continue;
   const whole=(' '+n+' ').includes(' '+a+' ');
   const distance=mvHybridEdit(n,a);
   let score=1-distance/Math.max(n.length,a.length);
   if(whole&&a.length>=5&&n===a)score=1;
   else if(a.length>=6&&n.startsWith(a+' ')&&n.length-a.length<=5)score=Math.max(score,.90);
   else if(a.length>=8&&n.length>=a.length-2&&n.length<=a.length+5){
     const suffix=a.slice(1);
     if(n.startsWith(suffix)||n.includes(' '+suffix))score=Math.max(score,.91);
   }
   // Avoid interpreting rules text (Lifelink, Valor, etc.) as a complete title.
   if(a.length<=5&&!whole)continue;
   if(score>=.88)ranked.push({name:item.name,score:Math.min(score,whole?1:.97),exact:whole});
 }
 ranked.sort((a,b)=>b.score-a.score||b.name.length-a.name.length);
 // Recover a severely damaged second word only if the long first word
 // uniquely identifies a catalog name. Never match arbitrary short fragments.
 if(!ranked.length){
  const fragments=n.split(' '),head=fragments[0]||'';
  if(head.length>=7 && fragments.length<=3 && fragments.slice(1).join('').length<=4){
   const unique=new Map();
   for(const bucket of mvHybridBuckets.values())for(const item of bucket){
    const first=item.n.split(' ')[0];
    if(first.length<7||Math.abs(first.length-head.length)>2)continue;
    const dist=mvHybridEdit(first,head);
    if(dist<=1)unique.set(item.name,{name:item.name,score:.94,exact:false});
   }
   if(unique.size===1)return [...unique.values()];
  }
 }
 // When the same OCR text supports both a full title and its trailing word,
 // retain the longer title unless the shorter title was the complete OCR line.
 return ranked.filter(c=>!ranked.some(other=>other!==c&&other.name.length>c.name.length&&mvHybridNorm(other.name).endsWith(' '+mvHybridNorm(c.name))&&mvHybridNorm(n)!==mvHybridNorm(c.name)&&other.score>=c.score-.08)).slice(0,3);
}

async function mvHybridArtworkScore(frame,card){let url=card.image_uris?.art_crop||card.card_faces?.[0]?.image_uris?.art_crop;if(!url)return null;let ref=mvHybridArtCache.get(url);if(ref===undefined){try{let img=new Image();img.crossOrigin='anonymous';img.referrerPolicy='no-referrer';img.src=url;await Promise.race([img.decode(),new Promise((_,rej)=>setTimeout(()=>rej(Error('image timeout')),2500))]);let t=document.createElement('canvas');t.width=120;t.height=120;t.getContext('2d').drawImage(img,0,0,120,120);ref=mvHybridFeatures(t)}catch(e){ref=null;mvLogCamera('Artwork unavailable: '+e.message,'info')}mvHybridArtCache.set(url,ref)}if(!ref)return null;

async function mvLoadBundledVisualIndex(){

async function mv53RefreshPrices(quiet=false){if(mv53RefreshRunning)return;mv53RefreshRunning=true;const ids=[...new Set(state.cards.map(c=>c.id).filter(id=>id&&!String(id).startsWith('unverified:')))],status=()=>document.getElementById('mv53PriceStatus')||document.getElementById('priceStatus');let ok=0,missing=0,failed=0;
 try{for(let i=0;i<ids.length;i+=75){const batch=ids.slice(i,i+75);if(status())status().textContent='Refreshing '+Math.min(i+batch.length,ids.length)+' / '+ids.length+' printings…';try{const response=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({identifiers:batch.map(id=>({id}))})});if(!response.ok)throw Error('Scryfall HTTP '+response.status);const payload=await response.json();const byId=new Map((payload.data||[]).map(c=>[c.id,c]));for(const id of batch){const found=byId.get(id);const saved=state.cards.find(c=>c.id===id);if(!saved)continue;if(!found){missing++;continue}const value=mv53PrintingPrice({...found,foil:saved.foil});if(value!==null||mv53Number(saved.price)===null)saved.price=value;saved.priceSource=value===null?'unavailable':'Scryfall USD';saved.priceUpdated=new Date().toISOString();saved.updated=saved.priceUpdated;if(value===null)missing++;else ok++}}catch(e){for(const id of batch){const saved=state.cards.find(c=>c.id===id);if(!saved)continue;try{const found=await scry('/cards/'+encodeURIComponent(id));const value=mv53PrintingPrice({...found,foil:saved.foil});if(value!==null){saved.price=value;saved.priceSource='Scryfall USD';saved.priceUpdated=new Date().toISOString();ok++}else missing++}catch{failed++}await new Promise(r=>setTimeout(r,110))}if(status())status().textContent='Batch request failed; individual card lookup attempted.'}if(i+75<ids.length)await new Promise(r=>setTimeout(r,180))}
 localStorage.setItem(STORE,JSON.stringify(state));if(ok){localStorage.setItem('mv53_price_refresh_at',new Date().toLocaleString());localStorage.setItem('mv53_price_refresh_at_iso',new Date().toISOString())}if(!quiet||tab==='Dashboard'||tab==='Price alerts')render();if(status())status().textContent=`Priced ${ok} printings · ${missing} unavailable · ${failed} request failures. No collection cards were removed.`;
 if(Array.isArray(state.priceHistory)&&ok){state.priceHistory.push({at:new Date().toISOString(),total:mv53Value('tcg'),cards:qtyTotal()});state.priceHistory=state.priceHistory.slice(-365);localStorage.setItem(STORE,JSON.stringify(state))}

async function mv53RefreshCardKingdom(){const status=()=>document.getElementById('mv53PriceStatus');if(status())status().textContent='Checking Card Kingdom feed…';try{const r=await fetch('https://api.cardkingdom.com/api/v2/pricelist',{headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const rows=Array.isArray(data)?data:Array.isArray(data.data)?data.data:Array.isArray(data.prices)?data.prices:Array.isArray(data.results)?data.results:[];if(!rows.length)throw Error('Unsupported price-feed format');let updated=0;const map=new Map(state.cards.map(c=>[String(c.id).toLowerCase(),c]));for(const item of rows){const id=String(item.scryfall_id||item.scryfallId||item.scryfall?.id||'').toLowerCase();const card=map.get(id);if(!card)continue;const retail=mv53Number(item.retail_price??item.retail??item.sell_price??item.price);const buylist=mv53Number(item.buylist_price??item.buy_price??item.buylist);if(retail===null&&buylist===null)continue;if(retail!==null)card.ckRetail=retail;if(buylist!==null)card.ckBuylist=buylist;card.ckUpdated=new Date().toISOString();updated++}localStorage.setItem(STORE,JSON.stringify(state));render();if(status())status().textContent=`Card Kingdom: matched ${updated} printings by exact Scryfall ID. ${updated?'':'Feed may use another schema; no values were invented.'}`;
 }catch(e){if(status())status().textContent='Card Kingdom pricing unavailable ('+e.message+'). Scryfall estimates remain available.'}}
// Existing collection entries created before v5.3 may contain placeholder zeroes.

for(const c of state.cards){if(Number(c.price)===0&&!c.priceSource){c.price=null;c.priceSource='unavailable'}}
if(navigator.onLine&&state.cards.length){const last=Date.parse(localStorage.getItem('mv53_price_refresh_at_iso')||'')||0;if(Date.now()-last>mv53Day){setTimeout(async()=>{await mv53RefreshPrices(true)},6500)}}

function mv58NativeStatus(message){const el=document.getElementById('mv58NativeStatus');if(el)el.textContent=message;}
function mv58CheckReference(card){
 const url=card?.image_uris?.art_crop||card?.card_faces?.[0]?.image_uris?.art_crop;
 if(!url||!window.ManaVaultNativeScanner){mv58NativeStatus('Matched title; artwork reference unavailable. Confirm the edition manually.');return;}

window.mvNativeScanResult=async function(data){
 if(tab!=='Scan cards'){tab='Scan cards';render()}
 const raw=String(data?.name||'').trim();
 mv58NativeStatus('Native '+(data.source||'OCR')+': '+raw+' · scan elapsed '+(data.elapsed||'?')+' ms · matching catalog…');
 let best=null;
 try{
  await mvHybridLoadNames();
  const candidates=mvHybridCandidates(raw);
  if(candidates.length){const first=candidates[0],second=candidates[1];
   // No remotely fuzzy one-shot guesses: plausible partial OCR is useful, but
   // short/gibberish text must not select an unrelated printing.
   if(first.score>=.92 && (!second || first.score-second.score>=.035 || first.score===1))best=first;
  }
  if(!best){
   // Only a *true exact* remote name may bypass an incomplete local index.
   const remote=await scry('/cards/named?exact='+encodeURIComponent(raw));
   if(remote?.name)best={name:remote.name,score:1,exact:true};
  }
  if(!best){
   lastSearch=raw;
   mv58NativeStatus('No confident name match for “'+raw+'”. Edit it with Search, or skip to the next queued scan.');
   const input=document.getElementById('searchInput');if(input)input.value=raw;
   return;
  }
  let card=await mvHybridFetchCard(best.name);
  if(!card){mv58NativeStatus('Name found but card details unavailable. Check your connection and retry.');return}
  if(!String(card.name||'').split(' // ').some(face=>mvHybridNorm(face)===mvHybridNorm(best.name)) && mvHybridNorm(card.name)!==mvHybridNorm(best.name)){
   try{card=await scry('/cards/named?exact='+encodeURIComponent(best.name))}catch{mv58NativeStatus('Card lookup disagreed with title. Please search manually.');return;}
  }
  mv58NativeStatus('Identified: '+card.name+' · checking edition evidence.');
  // Do not depend on the old browser camera's paused state.
  livePaused=true;
  const review=document.getElementById('liveReview');
  if(review){
   void mvPrintingReview(card,review,'native '+(data.source==='artwork'?'artwork candidate (confirm edition)':'ML Kit OCR '+Math.round(best.score*100)+'% title similarity')).catch(e=>mv58NativeStatus('Printing lookup: '+e.message));
   review.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  mv58CheckReference(card); // Never blocks printing review.
 }catch(e){mv58NativeStatus('Native recognition failed: '+e.message+' · use Search or try again.');}
};
// The initial Scryfall printing is just a suggestion; compare additional
// selected artworks asynchronously, never auto-save based on the dHash score.
const mv58OldPrintReview=mvPrintingReview;
mvPrintingReview=async function(card,container,confidence){
 await mv58OldPrintReview(card,container,confidence);
 if(!window.ManaVaultNativeScanner||!container)return;
 const selection=container.querySelector('select');
 if(selection)selection.addEventListener('change',()=>{
  // Compare the reference art for the *selected* Scryfall printing.
  // An artwork similarity score never confirms foil, condition, or set alone.
  const artwork=selection.selectedOptions?.[0]?.dataset.artUrl;
  mv58ArtworkPendingUrl=null;
  if(artwork)mv58CheckReference({image_uris:{art_crop:artwork}});
  else {const msg=document.getElementById('mv58ArtworkStatus');if(msg)msg.textContent='This printing has no art_crop reference.';}
 });
};


// v5.9.4: Older saved cards sometimes contain image:"" because the offline
// catalog uses image_small while Scryfall API responses use image_uris.small.
// Repair ONLY missing thumbnails from the existing printing ID; preserve all

let mv594RepairRunning=false;
async function mv594RepairSavedImages(){
 if(mv594RepairRunning||!Array.isArray(state.cards)||!state.cards.some(c=>!image(c)))return;
 if(!window.ManaVaultCardDB?.byId)return;
 mv594RepairRunning=true;
 try{
  let changed=0;
  for(const saved of state.cards){
   if(image(saved)||!saved.id)continue;
   const local=await ManaVaultCardDB.byId(saved.id);
   const url=local?.image_small||'';
   if(/^https:\/\/cards\.scryfall\.io\//.test(url)){saved.image=url;changed++}
  }
  if(changed){localStorage.setItem(STORE,JSON.stringify(state));if(tab==='Collection')render();
   mvLogCamera('Restored '+changed+' saved collection thumbnails from offline printings');}
 }catch(e){mvLogCamera('Saved-thumbnail repair deferred: '+e.message,'info')}

}

// v5.10: auto-save a scan only when identity and physical printing are resolved.
// Ambiguous editions/failed artwork checks go through the existing manual review.
let mv60Busy=false, mv60RankSerial=0;
const mv60SavedHistory=[];
const mv60RankWaiters=new Map();
window.mv60OnRankResult=function(result){
 const pending=mv60RankWaiters.get(String(result?.requestId||''));
 if(!pending)return;
 mv60RankWaiters.delete(String(result.requestId));
 clearTimeout(pending.timer);

};
function mv60PrintName(print){return mvHybridNorm(print?.name||'')}
function mv60CanonicalMatches(a,b){
 const x=mvHybridNorm(a), y=mvHybridNorm(b);
 return x===y||String(a||'').split(' // ').some(face=>mvHybridNorm(face)===y)
   ||String(b||'').split(' // ').some(face=>mvHybridNorm(face)===x);
}
async function mv60CollectPrintings(name,{localOnly=false}={}){
 let result=[],complete=false,source='';
 try{
  if(window.ManaVaultCardDB?.fastPrintings){
   const lookup=await ManaVaultCardDB.fastPrintings(name,2001);
   if(lookup.complete){
    result=lookup.rows;complete=true;source=lookup.source;
   }
  }else if(window.ManaVaultCardDB?.count && await ManaVaultCardDB.count()>=100000){
   const rows=await ManaVaultCardDB.printings(name,2001);
   if(rows.length<2001){result=rows;complete=true;source='IndexedDB';}
  }
 }catch(e){mvLogCamera('Offline printing search: '+e.message,'info')}
 if(!complete && localOnly)return {printings:[],complete:false,source:'Offline catalog still loading'};
 if(!complete){
  // Remote fallback must finish every page; a partial result must never be
  // mistaken for the only existing printing.
  result=[];let url='/cards/search?unique=prints&order=released&q='+encodeURIComponent('!"'+name+'"');
  let page=0;
  try{
   while(url&&page<12){
    const response=await scry(url);
    if(!Array.isArray(response.data))throw Error('Incomplete printing list');
    result.push(...response.data);
    url=response.has_more ? String(response.next_page||'') : '';
    if(url&&url.startsWith('https://api.scryfall.com'))url=url.slice('https://api.scryfall.com'.length);
    if(url&&!url.startsWith('/'))throw Error('Unexpected pagination URL');
    page++;
   }
   complete=!url;source='Scryfall';
  }catch(e){complete=false;mvLogCamera('Printing search incomplete: '+e.message,'info')}
 }
 const seen=new Set();
 result=result.filter(x=>{
  if(!x?.id||seen.has(x.id)||x.digital===true||x.lang&&x.lang!=='en'||
       !mv60CanonicalMatches(x.name,name))return false;
  seen.add(x.id);return true;
 });
 return {printings:result,complete,source};
}
function mv60ScryfallArtwork(print){
 return print?.image_uris?.art_crop || print?.card_faces?.[0]?.image_uris?.art_crop ||print?.image_url||'';
}
function mv60SafeArt(url){return /^https:\/\/cards\.scryfall\.io\//i.test(url||'')}
async function mv60RankArtwork(index,printings){
 const groups=new Map();
 for(const card of printings){
  const url=mv60ScryfallArtwork(card);
  // An incomplete reference set cannot justify automatic selection.
  if(!mv60SafeArt(url))return {reason:'Some printings have no usable artwork reference'};
  const key=String(card.illustration_id||'')||('id:'+card.id);
  if(!groups.has(key))groups.set(key,{art_url:url,id:card.id,illustration_id:card.illustration_id||'',ids:[]});
  groups.get(key).ids.push(card.id);
 }
 if(groups.size>24)return {reason:'More than 24 distinct artwork variants; collector marks needed'};
 if(!window.ManaVaultNativeScanner?.rankPrintings)return {reason:'Native artwork matcher unavailable'};
 const requestId='mv60-'+(++mv60RankSerial);
 const choices=[...groups.values()].map(x=>({id:x.id,art_url:x.art_url,illustration_id:x.illustration_id}));
 const result=await new Promise(resolve=>{
  const timer=setTimeout(()=>{mv60RankWaiters.delete(requestId);resolve({error:'Artwork comparison timed out'})},30000);
  mv60RankWaiters.set(requestId,{resolve,timer});
  try{
   ManaVaultNativeScanner.selectImage(index);
   ManaVaultNativeScanner.rankPrintings(JSON.stringify({requestId,choices,scan_index:index}));
  }catch(e){clearTimeout(timer);mv60RankWaiters.delete(requestId);resolve({error:e.message});}
 });
 if(result.error||!Array.isArray(result.matches)||result.matches.length!==choices.length)
  return {reason:result.error||'Not every reference artwork could be compared'};
 const top=result.matches[0],runner=result.matches[1];
 const margin=runner?(Number(top.score)-Number(runner.score)):1;
 // These are uncalibrated visual scores; require a strong unique match and
 // substantial separation before automatic edition selection.
 if(Number(top.score)<(choices.length===1?.96:.92)||margin<.075)return {reason:'Artwork does not distinguish this printing confidently'};
 const group=[...groups.values()].find(x=>x.id===top.id);
 if(!group)return {reason:'Artwork winner missing'};
 if(group.ids.length!==1)return {reason:'Multiple printings share this illustration',winningIds:group.ids,score:Number(top.score)};
 const selected=printings.find(x=>x.id===group.ids[0]);
 return selected ? {printing:selected,score:Number(top.score),margin} : {reason:'Artwork winner not in printing list'};
}
// v5.11.5: Fast, fully offline artwork comparison against the bundled art
// atlas. A missing reference is NOT a losing candidate: the comparison fails.
async function mv115RankBundledArtwork(index,printings){
 if(!window.ManaVaultNativeScanner?.rankBundledArtwork)return {reason:'No native bundled artwork matcher'};
 const groups=new Map();
 for(const p of printings){
  const key=p.illustration_id||'id:'+p.id;
  if(!groups.has(key))groups.set(key,{id:p.id,illustration_id:p.illustration_id||'',ids:[]});
  groups.get(key).ids.push(p.id);
 }
 if(groups.size<2||groups.size>24)return {reason:'Artwork cannot uniquely separate candidates'};
 const choices=[...groups.values()];
 const requestId='mv60-'+(++mv60RankSerial);
 const answer=await new Promise(resolve=>{
  const timer=setTimeout(()=>{mv60RankWaiters.delete(requestId);resolve({error:'Local artwork comparison timeout'});},650);
  mv60RankWaiters.set(requestId,{resolve,timer});
  try{
   ManaVaultNativeScanner.selectImage(index);
   ManaVaultNativeScanner.rankBundledArtwork(JSON.stringify({requestId,scan_index:index,choices}));
  }catch(e){clearTimeout(timer);mv60RankWaiters.delete(requestId);resolve({error:String(e.message||e)});}

function mv67FooterTokens(lines){

  // A four-digit year is never a collector number.
  for(const match of text.matchAll(/(?:^|[^A-Z0-9])([TS]?\d{1,5}[A-Z]?)(?=$|[^A-Z0-9])/g)){
   const n=match[1];if(/^\d{4}$/.test(n)&&+n>=1900&&+n<=2100)continue;

   if(/^[TS]\d{1,5}$/.test(n))numbers.add(n[0].toLowerCase()+String(Number(n.slice(1))));
   if(/^\d{1,5}$/.test(n))for(let width=n.length;width<=4;width++)numbers.add(n.padStart(width,'0'));

   const t=match[1];if(!['EN','NM','FOIL','ILLUS','ART','WOTC','WIZARDS','COPY','TOKEN','ILL','THE'].includes(t))codes.add(t.toLowerCase());

 </select></div><div><label for="mvCatalogCreature">Creature type</label><input id="mvCatalogCreature" type="search" placeholder="e.g. Sliver, Merfolk, Elf" value="${esc(mvCatalogCreature)}"></div></div><p class="muted small">Search Scryfall by name, color identity, type, creature type, set and rarity. Filters combine; internet required for catalog searches.</p><div id="searchResults"`);
};
function mvCatalogQuery(q){
 const parts=[];
 if(String(q||'').trim())parts.push('name:"'+String(q).replace(/["\\]/g,'').trim()+'"');
 if(mvCatalogColor)parts.push(mvCatalogColor==='C'?'id:c':'id>='+mvCatalogColor.toLowerCase());
 if(mvCatalogType)parts.push('t:'+mvCatalogType.toLowerCase());
 if(mvCatalogCreature){const creature=String(mvCatalogCreature).trim().replace(/[^a-zA-Z0-9 -]/g,'').slice(0,48);if(creature)parts.push('t:'+(/\s/.test(creature)?'\"'+creature+'\"':creature.toLowerCase()));}
 if(mvCatalogSet){const set=String(mvCatalogSet).trim().toLowerCase();if(/^[a-z0-9]{2,8}$/.test(set))parts.push('e:'+set);}
 if(mvCatalogRarity)parts.push('r:'+mvCatalogRarity);
 return parts.join(' ');
}
search=async function(q){
 lastSearch=q;
 const out=document.getElementById('searchResults');if(!out)return;
 const query=mvCatalogQuery(q);
 if(!query){out.textContent='Enter a name or select at least one search filter.';return;}
 out.textContent='Searching matching Magic printings…';
 try{
  const response=await scry('/cards/search?q='+encodeURIComponent(query)+'&unique=prints&order=name');
  searchResults=(response.data||[]).slice(0,60);
  out.innerHTML=resultRows();wireAdds();
 }catch(e){searchResults=[];out.innerHTML='<p class="error">'+esc(e.message)+'</p>';}
};
const mvCatalogBindBase=bind;
bind=function(){
 mvCatalogBindBase();
 if(tab!=='Scan cards')return;
 for(const [id,assign] of [
  ['mvCatalogColor',v=>mvCatalogColor=v],['mvCatalogType',v=>mvCatalogType=v],
  ['mvCatalogSet',v=>mvCatalogSet=v],['mvCatalogRarity',v=>mvCatalogRarity=v],
  ['mvCatalogCreature',v=>mvCatalogCreature=v]]){
  const element=document.getElementById(id);
  if(element)element.onchange=()=>assign(element.value);
 }
};
</script></body></html>

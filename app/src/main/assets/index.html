<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ManaVault — MTG Collection Studio</title><style>
:root{color-scheme:dark;--bg:#0d111a;--panel:#171e2b;--panel2:#202a3b;--line:#334054;--txt:#f1f4fa;--muted:#a6b3c7;--accent:#a4e2ba;--gold:#f6d38c;--danger:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 0,#233248 0,transparent 38%),var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#2d3b50;border:1px solid #50617a;color:var(--txt);border-radius:10px;padding:10px 13px}button:hover{filter:brightness(1.15)}button.primary{background:var(--accent);color:#0e2419;border-color:var(--accent);font-weight:700}button.warn{color:var(--danger)}input,select,textarea{width:100%;background:#101722;border:1px solid #425169;color:var(--txt);border-radius:9px;padding:11px}textarea{min-height:110px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}h1,h2,h3,p{margin-top:0}h1{font-size:26px;letter-spacing:-.8px}h2{font-size:19px}h3{font-size:15px}.shell{max-width:1240px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-weight:850;font-size:23px;letter-spacing:-.7px}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:13px;margin-top:3px}.tabs{display:flex;gap:7px;overflow:auto;padding:20px 0 16px}.tabs button{white-space:nowrap}.tabs button.active{background:#a4e2ba;color:#0e2419;border-color:#a4e2ba}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:var(--panel2);border-radius:12px;padding:16px}.stat strong{font-size:25px;display:block}.stat small,.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #303c50;padding:12px 0}.row:last-child{border:0}.thumb{width:49px;height:68px;object-fit:cover;border-radius:5px;background:#263348}.tag{display:inline-block;border:1px solid #586780;border-radius:99px;color:#c9d7e8;font-size:11px;padding:3px 8px;margin:2px}.result{display:flex;align-items:center;gap:11px;border-bottom:1px solid #354154;padding:10px 0}.result:last-child{border:0}.result img{width:48px;height:66px;object-fit:cover;border-radius:5px}.small{font-size:12px}.pill{color:var(--accent)}.hidden{display:none!important}.empty{padding:30px 8px;text-align:center;color:var(--muted)}.notice{background:#233a35;border:1px solid #3d6959;border-radius:10px;padding:12px;color:#d6f4e1;font-size:13px}.error{color:var(--danger)}.stack{display:grid;gap:12px}.scroll{max-height:480px;overflow:auto}.footer{font-size:12px;color:var(--muted);margin:24px 0}canvas{max-width:100%;border-radius:10px}a{color:var(--accent)}@media(max-width:700px){.shell{padding:13px}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.panel{padding:14px}.top{align-items:flex-start}.row{align-items:flex-start}}
 .help-steps{padding-left:22px;line-height:1.75;color:var(--txt)}.help-steps li{margin-bottom:6px}.help-section{scroll-margin-top:15px}.help-section summary{font-weight:700;cursor:pointer;padding:10px 0;font-size:16px}.help-section details{border-top:1px solid var(--line);padding:6px 0}.help-section details p{line-height:1.6;color:var(--muted)}.help-section details[open] summary{color:var(--accent)}.help-note{border-left:3px solid var(--gold);padding:9px 13px;background:#292a31;color:#f3e5c5;border-radius:6px}.help-links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}.help-links button{font-size:13px} </style><link rel="stylesheet" href="ui-polish.css"></head><body><div class="shell"><header class="top"><div><div class="brand">✦ Mana<span>Vault</span></div><div class="subtitle">Your cards. Your decks. Your next discovery.</div></div><div class="flex"><button id="exportBtn">Export backup</button><span id="mvBackupStatus" role="status" aria-live="polite" class="small muted"></span><label for="importFile" style="margin:0"><span style="display:inline-block;border:1px solid #50617a;border-radius:10px;padding:10px 13px;cursor:pointer">Import backup</span></label><input id="importFile" type="file" accept="application/json,.json" hidden></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main><div class="footer">ManaVault v5.12.32 · Native CameraX only · Collection saved locally on this device. Card details and prices from Scryfall when online. Not affiliated with Wizards of the Coast.</div></div><script src="card-db.js"></script><script src="collection-safety.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='manavault-v1';let state={cards:[],decks:[],wishlist:[],trades:[],alerts:[]};try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&Array.isArray(s.cards))state={...state,...s}}catch{};let tab='Dashboard',searchResults=[],scanCandidates=[],lastSearch='',busy=false;const tabs=['Dashboard','Collection','Scan cards','Deck builder','Wishlist & trades','Price alerts','Settings','Help guide'];const save=()=>{localStorage.setItem(STORE,JSON.stringify(state));render()};const money=n=>'$'+Number(n||0).toFixed(2);const qtyTotal=()=>state.cards.reduce((a,c)=>a+c.qty,0);const valueTotal=()=>state.cards.reduce((a,c)=>a+c.qty*(+c.price||0),0);const image=c=>c.image||c.image_small||c.image_url||c.image_uris?.small||'';
const mv594Placeholder='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 100"><rect width="72" height="100" rx="5" fill="#263348"/><rect x="8" y="8" width="56" height="84" rx="4" fill="none" stroke="#90a0b8" stroke-width="2"/><text x="36" y="58" text-anchor="middle" fill="#9aacc0" font-size="10">No art</text></svg>');window.mv594Placeholder=mv594Placeholder;const cardPrice=c=>c.prices?.usd||c.prices?.usd_foil||c.prices?.usd_etched||'0';const norm=s=>String(s||'').trim().toLowerCase();let info=c=>({id:c.id,name:c.name,set:c.set,set_name:c.set_name,collector_number:c.collector_number,rarity:c.rarity,colors:c.colors||[],color_identity:c.color_identity||[],type_line:c.type_line||'',oracle_text:c.oracle_text||'',cmc:c.cmc||0,legalities:c.legalities||{},image:c.image_uris?.small||c.card_faces?.[0]?.image_uris?.small||c.image_small||c.image_url||'',price:+cardPrice(c),updated:new Date().toISOString()});
function addCard(c,qty=1){let v=state.cards.find(x=>x.id===c.id);if(v)v.qty+=qty;else state.cards.push({...info(c),qty,condition:'NM',foil:false});save()}
function nav(){ $('#tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function render(){nav();let html='';if(tab==='Dashboard')html=dashboard();if(tab==='Collection')html=collection();if(tab==='Scan cards')html=scanner();if(tab==='Deck builder')html=decks();if(tab==='Wishlist & trades')html=wishes();if(tab==='Price alerts')html=alerts();if(tab==='Settings')html=settings();if(tab==='Help guide')html=helpGuide();$('#main').innerHTML=html;bind()}
const stat=(v,l)=>`<div class="stat"><strong>${v}</strong><small>${l}</small></div>`;
function dashboard(){const unique=new Set(state.cards.map(c=>c.name)).size;return `<h1>Collection overview</h1><div class="stats">${stat(qtyTotal(),'Physical cards')}${stat(unique,'Unique card names')}${stat(money(valueTotal()),'Estimated collection value')}${stat(state.decks.length,'Saved decks')}</div><div class="grid2" style="margin-top:15px"><section class="panel"><h2>Quick actions</h2><div class="stack"><button class="primary" data-go="Scan cards">Scan or search for cards →</button><button data-go="Deck builder">Find Commander builds →</button><button data-go="Collection">Browse your collection →</button></div></section><section class="panel"><h2>Most valuable cards</h2>${state.cards.length?state.cards.slice().sort((a,b)=>b.price-a.price).slice(0,5).map(c=>`<div class="row"><span>${esc(c.name)} <span class="muted small">×${c.qty}</span></span><b>${mv53Money(c.price)}</b></div>`).join(''):'<div class="empty">Add cards to see your collection insights.</div>'}</section></div><div class="notice">Start with Search in Scan cards, or paste a list of card names for batch import. Photos can be processed using optional browser OCR when available.</div>`}
function collection(){let q=window.filterQuery||'';let arr=state.cards.filter(c=>(c.name+' '+c.set_name).toLowerCase().includes(q.toLowerCase()));return `<h1>My collection</h1><div class="panel"><div class="flex"><input id="filter" class="grow" placeholder="Filter by card name or set" value="${esc(q)}"><button id="sortValue">Sort by value</button></div><div id="cardList" class="scroll">${cardRows(arr)}</div></div>`}
function cardRows(arr){return arr.length?arr.map(c=>`<div class="result"><img src="${esc(image(c)||mv594Placeholder)}" alt="Card artwork" loading="lazy" onerror="this.onerror=null;this.src=window.mv594Placeholder"><div class="grow"><b>${esc(c.name)}</b><div class="small muted">${c.unverifiedPrinting?'<strong>Printing unverified</strong>':esc((c.set_name||c.set||'')+(c.set?' ('+String(c.set).toUpperCase()+')':'')+(c.collector_number?' #'+c.collector_number:''))} · ${esc(c.condition||'NM')} · ${c.foil?'Foil':'Nonfoil'} · ${mv53Money(c.price)} each ${c.unverifiedPrinting?'':`<span title="Scryfall USD reference, not TCGplayer Market Price" class="small muted">· ${esc(c.priceSource==='Scryfall USD'?'Scryfall USD'+(c.priceUpdated?' · '+new Date(c.priceUpdated).toLocaleDateString():''):c.priceSource==='unavailable'||mv53Number(c.price)===null?'Price unavailable':c.priceSource||'Saved reference price')}</span>`}</div><div class="small muted">${esc(c.type_line)}</div>${c.unverifiedPrinting?`<button data-resolve-printing="${esc(c.id)}">Resolve edition</button>`:''}<button type="button" data-change-printing="${esc(c.id)}" title="Correct a saved set or collector number without deleting the card">Correct printing</button></div><div class="flex"><button data-dec="${esc(c.id)}" aria-label="Remove one copy of ${esc(c.name)}" title="Remove one copy (final copy requires confirmation)">−</button><b>×${c.qty}</b><button data-inc="${esc(c.id)}">+</button><button data-trade="${esc(c.id)}" title="Mark for trade">⇄</button></div></div>`).join(''):'<div class="empty">No matching cards yet.</div>'}
function scanner(){return `<h1>Scan & import cards</h1><section class="panel"><h2>Search a card</h2><p class="muted small">Search Scryfall for exact printings and current reference prices.</p><div class="flex"><input id="searchInput" class="grow" placeholder="e.g. Sol Ring, Skullclamp" value="${esc(lastSearch)}"><button class="primary" id="searchBtn">Search</button></div><div id="searchResults" class="scroll">${resultRows()}</div></section><section class="panel"><h2>Batch import</h2><p class="muted small">Paste card names, one per line. Supports “4 Sol Ring”, “4x Sol Ring”, or “Sol Ring”. Review the printing when needed.</p><textarea id="batch" placeholder="1 Sol Ring&#10;1 Arcane Signet&#10;2 Lightning Greaves"></textarea><div class="flex"><button class="primary" id="batchBtn">Import card names</button><span id="batchStatus" class="small muted"></span></div></section>`}
function resultRows(){return searchResults.length?searchResults.map((c,i)=>`<div class="result"><img src="${esc(info(c).image||mv594Placeholder)}" alt="Card artwork" loading="lazy"><div class="grow"><b>${esc(c.name)}</b><div class="small muted">${esc(c.set_name)} · ${esc(c.collector_number)} · ${money(cardPrice(c))}</div></div><button class="primary" data-add="${i}">+ Add</button></div>`).join(''):'<div class="empty">Search for a card to add it.</div>'}
async function scry(path){let r=await fetch('https://api.scryfall.com'+path);if(!r.ok)throw Error(r.status===404?'No matching card found':'Scryfall request failed ('+r.status+')');return r.json()}
async function search(q){lastSearch=q;$('#searchResults').innerHTML='<div class="empty">Searching…</div>';try{const r=await scry('/cards/search?q='+encodeURIComponent('!"'+q+'"')+'&unique=prints');searchResults=(r.data||[]).slice(0,30);$('#searchResults').innerHTML=resultRows();wireAdds()}catch(e){$('#searchResults').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function wireAdds(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCard(searchResults[+b.dataset.add]))}
function deckScore(c,colors){const ci=c.color_identity||[];if(!ci.every(x=>colors.includes(x)))return -1;let t=(c.type_line||'').toLowerCase(),o=(c.oracle_text||'').toLowerCase();return (t.includes('creature')?2:0)+(o.includes('draw')?2:0)+(o.includes('add {')?2:0)+(o.includes('destroy')?1:0)+(o.includes('token')?1:0)+(o.includes('search your library')?2:0)}
function deckCandidates(){return state.cards.filter(c=>/legendary creature|can be your commander/i.test((c.type_line||'')+' '+(c.oracle_text||'')) && c.legalities?.commander!=='not_legal').slice().sort((a,b)=>b.qty-a.qty)}
function decks(){return `<h1>Commander deck studio</h1><div class="grid2"><section class="panel"><h2>Discover commanders you own</h2><p class="muted small">Select a commander to build a collection-only starter list. Suggestions are heuristic, not AI-generated or a guaranteed complete 100-card deck.</p><div class="scroll">${deckCandidates().length?deckCandidates().map(c=>`<div class="row"><div><b>${esc(c.name)}</b><div class="small muted">Color identity: ${(c.color_identity||[]).join('')||'Colorless'}</div></div><button data-build="${esc(c.id)}">Build</button></div>`).join(''):'<div class="empty">Add legendary creatures to discover possible commanders.</div>'}</div></section><section class="panel"><h2>Saved deck concepts</h2>${state.decks.length?state.decks.map((d,i)=>`<div class="row"><div><b>${esc(d.name)}</b><div class="small muted">${d.cards.length} suggested cards · ${esc(d.created)}</div></div><div class="flex"><button data-viewdeck="${i}">View</button><button class="warn" data-deldeck="${i}">×</button></div></div>`).join(''):'<div class="empty">Your saved builds appear here.</div>'}<div id="deckDetail"></div></section></div>`}
function buildDeck(id){let cmd=state.cards.find(c=>c.id===id);if(!cmd)return;let cards=state.cards.filter(c=>c.id!==id&&c.legalities?.commander!=='not_legal').map(c=>({c,score:deckScore(c,cmd.color_identity||[])})).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score).slice(0,99).map(x=>({id:x.c.id,name:x.c.name,qty:Math.min(x.c.qty,/basic land/i.test(x.c.type_line)?99:1)}));state.decks.push({name:cmd.name+' — collection concept',commander:cmd.name,colors:cmd.color_identity||[],cards,created:new Date().toLocaleDateString()});save()}
function wishes(){return `<h1>Wishlist & trades</h1><div class="grid2"><section class="panel"><h2>Wishlist</h2><div class="flex"><input id="wishInput" placeholder="Card to acquire"><button class="primary" id="wishBtn">Add</button></div>${state.wishlist.map((w,i)=>`<div class="row">${esc(w)}<button data-delwish="${i}">Remove</button></div>`).join('')||'<div class="empty">No wishlist cards yet.</div>'}</section><section class="panel"><h2>Available for trade</h2>${state.trades.map((id,i)=>{let c=state.cards.find(x=>x.id===id);return c?`<div class="row">${esc(c.name)} <span>${money(c.price)} <button data-untrade="${i}">Remove</button></span></div>`:''}).join('')||'<div class="empty">Use ⇄ next to a collection card to mark it for trade.</div>'}</section></div>`}
function alerts(){return `<h1>Price watchlist</h1><div class="panel"><p class="muted small">Set a price threshold. Alerts are checked only when you open this page or manually refresh prices; this version does not send background notifications.</p><div class="grid3"><div><label>Card in collection</label><select id="alertCard">${state.cards.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Notify at or above (USD)</label><input id="alertThreshold" type="number" min="0" step="0.01" placeholder="10.00"></div><div style="align-self:end"><button class="primary" id="alertBtn">Add price watch</button></div></div>${state.alerts.map((a,i)=>{let c=state.cards.find(x=>x.id===a.id);return `<div class="row"><span>${esc(c?.name||'Removed card')} · target ${money(a.threshold)} · current ${money(c?.price)} ${c&&c.price>=a.threshold?'<span class="pill">● Threshold reached</span>':''}</span><button data-delalert="${i}">Remove</button></div>`}).join('')||'<div class="empty">No price watches yet.</div>'}<button id="refreshPrices">Refresh collection prices</button><span id="priceStatus" class="small muted"></span></div>`}
function settings(){return `<h1>Settings & data</h1><section class="panel"><h2>Your data</h2><p>All data is stored in this browser's localStorage. It is not synchronized between your phone and computer. On Android, Save JSON backup opens the system file picker and verifies the saved file. Export before installing updates or clearing data.</p><div class="flex"><button id="export2">Save JSON backup</button><span id="mvBackupSettingsStatus" role="status" aria-live="polite" class="small muted">${esc(mvBackupMessage)}</span><button class="warn" id="clearAll">Delete local collection</button></div></section><section class="panel"><h2>Prototype limitations</h2><p class="muted">Native CameraX performs on-device OCR and offline printing checks. Confirm ambiguous editions when prompted. Card prices are Scryfall reference prices, not guaranteed sale prices. Foil and condition-based valuations, automatic missing-card optimization, cross-device accounts, AI chat, notifications, and native Android packaging are planned but not implemented.</p></section>`}
// Android WebView cannot reliably download a blob: URL. Save through the
// system document picker and wait for native write+readback verification.
let mvBackupPending = false, mvBackupMessage = '';
function mvBackupShow(message, failed=false) {
 mvBackupMessage = message;
 for (const id of ['mvBackupStatus','mvBackupSettingsStatus']) {
  const el = document.getElementById(id);
  if (el) { el.textContent = message; el.style.color = failed ? '#e3a7a7' : ''; }
 }
 for (const id of ['exportBtn','export2']) {
  const el = document.getElementById(id);
  if (el) el.disabled = mvBackupPending;
 }
}
window.mvBackupExportResult = function (result) {
 mvBackupPending = false;
 mvBackupShow(result?.message || 'Backup ended without confirmation.', !result?.ok);
};
function backup() {
 if (mvBackupPending) return;
 try {
  // Back up precisely the persisted physical collection and deck inventory.
  // Never substitute an empty state if local storage cannot be read.
  const saved = localStorage.getItem(STORE);
  if (!saved) throw new Error('No saved collection data found. Nothing exported.');
  const parsed = JSON.parse(saved);
  if (!parsed || !Array.isArray(parsed.cards)) throw new Error('Stored collection is invalid. Nothing exported.');
  const filename = 'manavault-backup-' + new Date().toISOString().slice(0,10) + '.json';
  if (window.ManaVaultNative?.exportBackup) {
   mvBackupPending = true;
   mvBackupShow('Choose where to save '+parsed.cards.length+' collection printings…');
   try { window.ManaVaultNative.exportBackup(saved, filename); }
   catch (e) { mvBackupPending = false; throw e; }
   return;
  }
  // Browser-only preview fallback; unlike Android, this download may not be
  // verifiable, so clearly ask the user to confirm it exists.
  const blob = new Blob([saved], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  mvBackupShow('Browser download requested. Check Downloads to confirm the JSON exists.');
 } catch (e) {
  mvBackupPending = false;
  mvBackupShow('Backup failed: ' + e.message, true);
 }
}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});if(tab==='Collection'){let f=$('#filter');f.oninput=()=>{window.filterQuery=f.value;$('#cardList').innerHTML=cardRows(state.cards.filter(c=>(c.name+' '+c.set_name).toLowerCase().includes(f.value.toLowerCase())));bindCollection()};$('#sortValue').onclick=()=>{$('#cardList').innerHTML=cardRows(state.cards.slice().sort((a,b)=>b.price-a.price));bindCollection()};bindCollection()}if(tab==='Scan cards'){ $('#searchBtn').onclick=()=>search($('#searchInput').value.trim());$('#searchInput').onkeydown=e=>{if(e.key==='Enter')search(e.target.value.trim())};wireAdds();$('#batchBtn').onclick=batchImport;document.querySelectorAll('[data-lookup]').forEach(b=>b.onclick=()=>{lastSearch=b.dataset.lookup;render();search(lastSearch)})}if(tab==='Deck builder'){document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>buildDeck(b.dataset.build));document.querySelectorAll('[data-deldeck]').forEach(b=>b.onclick=()=>{state.decks.splice(+b.dataset.deldeck,1);save()});document.querySelectorAll('[data-viewdeck]').forEach(b=>b.onclick=()=>{let d=state.decks[+b.dataset.viewdeck];$('#deckDetail').innerHTML=`<h3>${esc(d.name)}</h3><p class="small muted">This is a candidate list, not a finalized legal deck. Check quantities and missing roles.</p><div class="scroll">${d.cards.map(c=>`<div class="row">${c.qty} × ${esc(c.name)}</div>`).join('')}</div><button id="copyDeck">Copy list</button>`;$('#copyDeck').onclick=()=>navigator.clipboard?.writeText(d.cards.map(c=>c.qty+' '+c.name).join('\n'))})}if(tab==='Wishlist & trades'){$('#wishBtn').onclick=()=>{let w=$('#wishInput').value.trim();if(w){state.wishlist.push(w);save()}};document.querySelectorAll('[data-delwish]').forEach(b=>b.onclick=()=>{state.wishlist.splice(+b.dataset.delwish,1);save()});document.querySelectorAll('[data-untrade]').forEach(b=>b.onclick=()=>{state.trades.splice(+b.dataset.untrade,1);save()})}if(tab==='Price alerts'){ // Version 1.5: scan audio feedback (generated locally, no audio files).
let scanAudioLevel=Number(localStorage.getItem('manavault_scan_volume') ?? '0.45');
let scanAudioContext;
function scanTone(ok){
  if(scanAudioLevel<=0)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    scanAudioContext ||= new AC();
    if(scanAudioContext.state==='suspended')scanAudioContext.resume().catch(()=>{});
    const start=scanAudioContext.currentTime+0.02;
    const notes=ok?[{f:660,t:0,d:.10},{f:880,t:.12,d:.16}]:[{f:330,t:0,d:.14},{f:220,t:.16,d:.22}];
    notes.forEach(n=>{
      const o=scanAudioContext.createOscillator(),g=scanAudioContext.createGain();
      o.type=ok?'sine':'triangle';o.frequency.value=n.f;
      g.gain.setValueAtTime(.0001,start+n.t);
      g.gain.exponentialRampToValueAtTime(Math.max(.0001,scanAudioLevel*.16),start+n.t+.015);
      g.gain.exponentialRampToValueAtTime(.0001,start+n.t+n.d);
      o.connect(g).connect(scanAudioContext.destination);
      o.start(start+n.t);o.stop(start+n.t+n.d+.02);
    });
  }catch(e){console.warn('Audio unavailable',e)}
}

 });

// v5.12.18: Real prices are looked up by exact Scryfall printing ID,
// never by a same-name edition. Queue recently saved scans after the scanner
// closes to avoid requests interfering with recognition or camera latency.
let mv517PriceRefreshing=false;
async function mv517RefreshExactPrices(ids,{quiet=false}={}){
 if(mv517PriceRefreshing||!navigator.onLine)return {updated:0,failed:0,skipped:true};
 const exact=new Set((ids||[]).filter(id=>/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(String(id||''))));
 // Local fixtures often use non-UUID IDs; actual Scryfall printing IDs use UUIDs.
 if(!exact.size)return {updated:0,failed:0,skipped:true};
 mv517PriceRefreshing=true;let updated=0,failed=0;
 const status=()=>document.getElementById('mv517PriceStatus');
 try{
  const batch=[...exact];
  for(let i=0;i<batch.length;i+=75){
   if(status())status().textContent='Refreshing '+Math.min(i+75,batch.length)+'/'+batch.length+' printing prices…';
   try{
    const response=await fetch('https://api.scryfall.com/cards/collection',{
     method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
     body:JSON.stringify({identifiers:batch.slice(i,i+75).map(id=>({id}))})});
    if(!response.ok)throw Error('HTTP '+response.status);
    const json=await response.json();
    const returned=new Map((json.data||[]).map(row=>[row.id,row]));
    for(const id of batch.slice(i,i+75)){
     const current=state.cards.find(c=>c.id===id);
     const remote=returned.get(id);
     if(!current||!remote){failed++;continue;}
     // Guard against a stale or corrupt ID mapping; never reprice a card
     // using a different collector number, set code or canonical name.
     if(String(current.set||'').toLowerCase()!==String(remote.set||'').toLowerCase() ||
       mv61CollectorKey(current.collector_number)!==mv61CollectorKey(remote.collector_number) ||
       !mv60CanonicalMatches(current.name,remote.name)){failed++;continue;}
     const amount=mv53PrintingPrice({...remote,foil:!!current.foil});
     current.price=amount;
     current.priceSource=amount===null?'unavailable':'Scryfall USD';
     current.priceUpdated=new Date().toISOString();
     updated++;
    }
   }catch(e){failed+=Math.min(75,batch.length-i);if(status())status().textContent='Price lookup failed: '+e.message;}
  }
  if(updated){localStorage.setItem(STORE,JSON.stringify(state));if(!quiet)render();}
  if(status())status().textContent='Updated '+updated+' exact printing prices'+(failed?' · '+failed+' unavailable/failed':'')+'. Scryfall USD, not live TCGplayer Market Price.';
 }finally{mv517PriceRefreshing=false;}
 return {updated,failed};
}
function mv517RefreshAfterScan(){
 if(!navigator.onLine||mv517PriceRefreshing)return;
 const now=Date.now();
 const ids=mv60SavedHistory.filter(h=>h.owned).map(h=>h.id).filter(id=>{
  const c=state.cards.find(card=>card.id===id);
  return c && (mv53Number(c.price)===null || now-(Date.parse(c.priceUpdated)||0)>86400000);
 });
 if(ids.length)setTimeout(()=>{if(!window.mvNativeScannerBusy)void mv517RefreshExactPrices(ids,{quiet:true});},650);
}
// v5.12.11: Combined, offline collection-search filters.
const mvCollectionColors=['','W','U','B','R','G','C'];
const mvCollectionTypes=['','Creature','Instant','Sorcery','Artifact','Enchantment','Planeswalker','Land','Battle','Token'];
let mvCollectionColor='',mvCollectionType='',mvCollectionCreature='',mvCollectionSort='name';
function mvCreatureSubtypeMatch(typeLine,requested){
 const target=String(requested||'').toLowerCase().trim().replace(/\s+/g,' ');
 if(!target)return true;
 const line=String(typeLine||'');
 if(!/\bcreature\b/i.test(line))return false;
 // Creature subtypes appear AFTER the long/short dash on physical MTG types.
 // Supports multiword subtypes: Time Lord, Assembly-Worker, etc.
 const subtypeParts=line.split(/\s+[—–-]\s+/);
 if(subtypeParts.length<2)return false;
 const words=subtypeParts.slice(1).join(' ').toLowerCase().replace(/\s+/g,' ').trim();
 return new RegExp('(?:^|[^a-z0-9-])'+target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^a-z0-9-])','i').test(words);
}
function mvCollectionFiltered(){
 const query=String(window.filterQuery||'').trim().toLowerCase();
 return state.cards.filter(c=>{
  if(query && ![c.name,c.set_name,c.set,c.collector_number,c.type_line].some(v=>String(v||'').toLowerCase().includes(query)))return false;
  if(mvCollectionColor){
   const colors=Array.isArray(c.color_identity)&&c.color_identity.length?c.color_identity:
    Array.isArray(c.colors)?c.colors:[];
   if(mvCollectionColor==='C'){
    if(c.unverifiedPrinting||colors.length!==0)return false;
   }else if(!colors.includes(mvCollectionColor))return false;
  }
  if(mvCollectionType&&!String(c.type_line||'').toLowerCase().includes(mvCollectionType.toLowerCase()))return false;
  if(mvCollectionCreature&&!mvCreatureSubtypeMatch(c.type_line,mvCollectionCreature))return false;
  return true;
 }).sort((a,b)=>mvCollectionSort==='value'?(Number(b.price)||0)-(Number(a.price)||0):
  String(a.name).localeCompare(String(b.name)));
}

// v5.12.18: Non-destructive printing correction for an exact collected card.
// Move only the selected quantity; keep condition/finish intact and leave
// completed decklists unchanged. Persist in one write; don't touch scan data.
function mv517ApplyPrintingCorrection(id,printing,count){
 const previous=state.cards.find(c=>c.id===id);
 const n=Number(count);
 if(!previous||!Number.isSafeInteger(n)||n<1||n>Number(previous.qty))throw Error('Invalid collection quantity');
 if(!printing?.id||printing.id===id||!mv60CanonicalMatches(previous.name,printing.name))throw Error('Choose a different printing of the same card');
 const other=state.cards.find(c=>c.id===printing.id);
 if(other && (String(other.condition||'NM')!==String(previous.condition||'NM')||!!other.foil!==!!previous.foil))
  throw Error('Target printing has a different condition or foil setting; cannot merge safely');
 const snapshot=state.cards.map(c=>({...c}));
 try{
  const price=mv53PrintingPrice({...printing,foil:!!previous.foil});
  const fresh={...info(printing),condition:previous.condition||'NM',foil:!!previous.foil,
   price,priceSource:price===null?'unavailable':'Scryfall USD',
   priceUpdated:price===null?null:new Date().toISOString(),qty:n};
  previous.qty-=n;
  if(previous.qty===0)state.cards=state.cards.filter(c=>c!==previous);
  if(other)other.qty+=n;else state.cards.push(fresh);
  localStorage.setItem(STORE,JSON.stringify(state));
  return {name:printing.name,set:printing.set,collector_number:printing.collector_number,qty:n,id:printing.id};
 }catch(e){state.cards=snapshot;throw e;}
}
async function mv517OpenPrintingCorrection(id){
 const original=state.cards.find(c=>c.id===id),panel=document.getElementById('mv517CorrectPanel');
 if(!original||!panel)return;
 panel.hidden=false;panel.replaceChildren();
 const title=document.createElement('h3');title.textContent='Correct printing: '+original.name;panel.appendChild(title);
 const summary=document.createElement('p');summary.className='small muted';
 summary.textContent='Currently '+String(original.set||'?').toUpperCase()+' #'+(original.collector_number||'?')+' · '+original.qty+' owned. Existing decks will not change.';panel.appendChild(summary);
 const status=document.createElement('p');status.className='small muted';status.textContent='Looking up all editions…';panel.appendChild(status);
 const selector=document.createElement('select');selector.setAttribute('aria-label','Select correct printing');panel.appendChild(selector);
 const exactSet=document.createElement('input');exactSet.placeholder='Set code (e.g. WWK)';exactSet.style.width='145px';exactSet.setAttribute('aria-label','Printed set code');panel.appendChild(exactSet);
 const exactNum=document.createElement('input');exactNum.placeholder='Collector # (e.g. 95)';exactNum.style.width='170px';exactNum.setAttribute('aria-label','Printed collector number');panel.appendChild(exactNum);
 const exactFind=document.createElement('button');exactFind.textContent='Find set + #';panel.appendChild(exactFind);
 const number=document.createElement('input');number.type='number';number.min='1';number.max=String(original.qty);number.value='1';number.style.width='88px';number.setAttribute('aria-label','Copies to move');panel.appendChild(number);
 const apply=document.createElement('button');apply.className='primary';apply.textContent='Move selected copies';apply.disabled=true;panel.appendChild(apply);
 const cancel=document.createElement('button');cancel.textContent='Cancel';cancel.onclick=()=>{panel.hidden=true;panel.replaceChildren()};panel.appendChild(cancel);
 try{
  const result=await mv60CollectPrintings(original.name);
  if(!panel.isConnected)return;
  // Thousands of Forest printings can exceed the name-query page cap. Keep
  // an exact set+collector lookup available even if name enumeration fails.
  const prints=(result.printings||[]).filter(p=>p.id!==id&&mv60CanonicalMatches(p.name,original.name));
  const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Select correct set and collector number';selector.appendChild(placeholder);
  const addChoices=cards=>{
   for(const card of cards){
    if(!card?.id||card.id===id||!mv60CanonicalMatches(card.name,original.name))continue;
    if(!prints.some(p=>p.id===card.id))prints.push(card);
    if([...selector.options].some(o=>o.value===card.id))continue;
    const option=document.createElement('option');option.value=card.id;
    option.textContent=(card.set_name||card.set||'?')+' ('+String(card.set||'').toUpperCase()+') #'+(card.collector_number||'?')+' · '+(card.rarity||'');selector.appendChild(option);
   }
   apply.disabled=!prints.length;
  };
  addChoices([...prints]);
  status.textContent=result.complete?'Choose the exact edition printed on your card. Use Set + # to narrow long lists.':'Large or incomplete edition list: enter the printed set code and collector number for an exact lookup.';
  exactFind.onclick=async()=>{
   const set=exactSet.value.trim().toLowerCase(),collector=mv61CollectorKey(exactNum.value);
   if(!/^[a-z0-9]{2,5}$/.test(set)||!collector){status.textContent='Enter a valid set code and printed collector number.';return;}
   status.textContent='Checking '+set.toUpperCase()+' #'+collector+'…';exactFind.disabled=true;
   try{
    let rows=typeof window.ManaVaultCardDB?.bySetCollectorAll==='function'
      ? await window.ManaVaultCardDB.bySetCollectorAll(set,collector,30) : [];
    if(!rows.length&&navigator.onLine){
     try{const remote=await scry('/cards/'+encodeURIComponent(set)+'/'+encodeURIComponent(collector));rows=[remote]}catch{}
    }
    rows=(rows||[]).filter(p=>String(p.set||'').toLowerCase()===set&&mv61CollectorKey(p.collector_number)===collector&&mv60CanonicalMatches(p.name,original.name));
    addChoices(rows);
    if(rows.length){selector.value=rows[0].id;status.textContent=rows.length+' matching printing(s). Verify edition and finish before moving copies.';}
    else status.textContent='No matching edition of '+original.name+' at '+set.toUpperCase()+' #'+collector+'. Your saved card is unchanged.';
   }catch(e){status.textContent='Exact printing lookup failed: '+e.message;}
   finally{exactFind.disabled=false;}
  };
  apply.onclick=()=>{
   const selected=prints.find(c=>c.id===selector.value);if(!selected){status.textContent='Choose a printing first.';return;}
   const copies=Number(number.value);
   if(!Number.isSafeInteger(copies)||copies<1||copies>Number(original.qty)){status.textContent='Invalid quantity.';return;}
   const verified=confirm('Move '+copies+' × '+original.name+' from '+String(original.set||'?').toUpperCase()+
    ' #'+(original.collector_number||'?')+' to '+String(selected.set||'?').toUpperCase()+' #'+selected.collector_number+'? This will not alter existing decks.');
   if(!verified)return;
   try{
    const result=mv517ApplyPrintingCorrection(id,selected,copies);
    render();
    if(navigator.onLine)void mv517RefreshExactPrices([result.id],{quiet:true});
   }catch(e){status.textContent='Correction not saved: '+e.message;}
  };
 }catch(e){status.textContent='Printing lookup failed: '+e.message;}
}

 </select></div><div><label for="mvCatalogCreature">Creature type</label><input id="mvCatalogCreature" type="search" placeholder="e.g. Sliver, Merfolk, Elf" value="${esc(mvCatalogCreature)}"></div></div><p class="muted small">Search Scryfall by name, color identity, type, creature type, set and rarity. Filters combine; internet required for catalog searches.</p><div id="searchResults"`);

function mvCatalogQuery(q){
 const parts=[];
 if(String(q||'').trim())parts.push('name:"'+String(q).replace(/["\\]/g,'').trim()+'"');
 if(mvCatalogColor)parts.push(mvCatalogColor==='C'?'id:c':'id>='+mvCatalogColor.toLowerCase());
 if(mvCatalogType)parts.push('t:'+mvCatalogType.toLowerCase());
 if(mvCatalogCreature){const creature=String(mvCatalogCreature).trim().replace(/[^a-zA-Z0-9 -]/g,'').slice(0,48);if(creature)parts.push('t:'+(/\s/.test(creature)?'\"'+creature+'\"':creature.toLowerCase()));}
 if(mvCatalogSet){const set=String(mvCatalogSet).trim().toLowerCase();if(/^[a-z0-9]{2,8}$/.test(set))parts.push('e:'+set);}
 if(mvCatalogRarity)parts.push('r:'+mvCatalogRarity);
 return parts.join(' ');
}
